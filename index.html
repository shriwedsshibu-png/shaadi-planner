<style>

.vend{padding:.9rem 1rem;margin-bottom:.8rem}
.vend h4{margin:0;font-size:1.05rem}.cat{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.6rem;text-align:center}

.hero .money div{background:rgba(0,0,0,.2);color:#f1e2c4}.hero .money b{color:#ffe2a3}

.acts{display:flex;gap:.45rem;align-items:center;margin-top:.6rem;flex-wrap:wrap}
a.call,button.call{display:inline-block;text-align:center;line-height:1.35;color:var(--maroon);font-weight:700;text-decoration:none;border:1.5px solid var(--maroon);border-radius:99px;padding:.35rem .9rem;font-size:.9rem;background:#fff;cursor:pointer;min-height:2.4rem}

.addbig{width:100%;margin-top:1rem;background:linear-gradient(180deg,#e0bb6a,#b8893b);color:#3b1a1a;border:1.5px solid #f1d99a;border-radius:1rem;padding:.9rem;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 16px rgba(143,106,38,.3)}
.sub2{display:block;font-size:.72em;opacity:.85;font-weight:600}

.sheetbg.center{align-items:center}
.sbar{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top));z-index:29;background:var(--ivory);padding:.6rem 1rem;border-bottom:1px solid rgba(184,137,59,.35);box-shadow:0 4px 10px rgba(74,17,32,.06)}

.res-note{font-size:.9rem;color:var(--muted);margin:.3rem .2rem .6rem}
.seeall{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #eadcc0;padding:.8rem 1rem;color:var(--maroon);font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
.delbtn{display:block;width:100%;margin-top:1rem;background:none;border:2px solid #c0392b;color:#c0392b;border-radius:.9rem;padding:.8rem;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;min-height:3rem}
.seg2{display:flex;gap:.4rem;margin-top:.5rem}.seg2 button{flex:1;border:2px solid #d9c79c;background:#fff;color:var(--maroon);border-radius:.8rem;padding:.55rem;font-weight:700;cursor:pointer;min-height:2.8rem;font-family:inherit;font-size:.95rem}.seg2 button.on{background:var(--maroon);color:#fff7e6;border-color:var(--maroon)}

.tile{background:#fffdf9;border:1px solid rgba(184,137,59,.4);border-radius:1rem;padding:.8rem;text-align:left;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(74,17,32,.06)}
.tile b{display:block;font-family:'Cormorant Garamond',serif;font-size:2rem;line-height:1;color:var(--maroon)}
.tile span{font-size:.85rem;color:var(--muted)}
.tile.warn b{color:var(--bad)}
.badge{display:inline-block;border-radius:99px;padding:.05rem .55rem;font-size:.72rem;font-weight:700}
.b-ok{background:#e3f0e6;color:#2a6a38}.b-no{background:#fde8e6;color:var(--bad)}.b-warn{background:#fff3da;color:#8a5a00}.b-info{background:#efe6f7;color:#5b3a82}
.flow{display:flex;gap:.8rem;padding:.8rem;border-bottom:1px solid rgba(184,137,59,.2);cursor:pointer}
.flow:last-child{border-bottom:0}
.flow .tm{flex:none;width:4.4rem;font-family:'Cinzel',serif;font-weight:700;color:var(--maroon);font-size:.95rem;line-height:1.2}
.flow .tm small{display:block;font-family:'Lora',serif;font-weight:500;color:var(--muted);font-size:.75rem}
.flow.now{background:#fff3da}.flow.past{opacity:.55}
.install{display:flex;gap:.8rem;align-items:center;padding:.9rem 1rem;margin-top:1rem;border:1.5px solid var(--gold);background:linear-gradient(180deg,#fff8e8,#fff1d6)}
.install .ic{font-size:1.8rem}
.steps{margin:.5rem 0 0;padding-left:1.2rem}.steps li{margin:.45rem 0}
.amt{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.3rem;color:var(--maroon);white-space:nowrap}
html.big header.top h1{font-size:.8rem}html.big .who{font-size:.72rem;max-width:7.5rem}html.big .netpill{font-size:.65rem}
.who{min-width:4.2rem}
@media(max-width:380px){header.top{padding-left:.7rem;padding-right:.7rem}header.top h1{font-size:.8rem;letter-spacing:.03em}.who{padding:.3rem .6rem;max-width:6.5rem;font-size:.8rem}.money b{font-size:.8rem}.money{gap:.25rem}.hero{padding:1rem}nav.bottom button{font-size:.6rem}}

<body>
<header class="top" id="hdr" style="display:none"><h1>🪔 SHAADI PLANNER</h1><div class="hright"><button class="netpill" id="netPill" data-act="netinfo" style="display:none"></button><button class="who" id="whoBtn" data-act="settings" title="Name, language, app"></button></div></header>
<div class="sbar" id="sbar" style="display:none"><div class="in"><span class="si">🔍</span><input class="input" id="gq" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search task, guest, vendor, date…" /><button class="sx" id="gqx" data-act="clearsearch" aria-label="Clear search">✕</button></div></div>

<script>
/* ============ SETTINGS (the only part you may edit) ============ */

/* ================================================================ */

  { n: 'Before the wedding', hi: 'शादी से पहले', d: '' },

];
var PRIO = { P0: { en: 'Critical', hi: 'बहुत ज़रूरी' }, P1: { en: 'Important', hi: 'ज़रूरी' }, P2: { en: 'Normal', hi: 'सामान्य' } };

var $app = document.getElementById('app');
var LS = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return ymd(new Date()); }
function dayNum(s) { var p = String(s).slice(0, 10).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
function diff(s) { return dayNum(s) - dayNum(today()); }
function money(n) { return '₹' + Math.round(n || 0).toLocaleString('en-IN'); }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var MON_HI = ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'];

function niceTime(t) { if (!t) return ''; var p = String(t).split(':'), h = +p[0], m = p[1] || '00'; return (h % 12 || 12) + ':' + m + (h < 12 ? ' AM' : ' PM'); }

function B(en, hi) { return S.lang === 'hi' ? '<span class="hi">' + esc(hi) + '</span>' : esc(en) + ' <span class="hi">· ' + esc(hi) + '</span>'; }    // inline
function B2(en, hi) { return S.lang === 'hi' ? '<span class="hi">' + esc(hi) + '</span>' : '<span>' + esc(en) + '</span><span class="sub2 hi">' + esc(hi) + '</span>'; }  // stacked
function L(en, hi) { return S.lang === 'hi' ? hi : en; }   // plain text (toasts, placeholders)
function applyLang() { var h = document.documentElement; h.classList.toggle('big', S.lang === 'big'); h.classList.toggle('hionly', S.lang === 'hi'); h.lang = S.lang === 'hi' ? 'hi' : 'en'; var q = document.getElementById('gq'); if (q) q.placeholder = L('Search task, guest, vendor, date…', 'काम, मेहमान, नाम या तारीख़ खोजें…'); }

/* ---------- network ---------- */
function api(method, payload) {
  if (!CONFIG.scriptUrl) return Promise.reject(new Error('NOURL'));
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, timer = ctl ? setTimeout(function () { ctl.abort(); }, 30000) : 0;
  var req = method === 'GET'
    ? fetch(CONFIG.scriptUrl + '?' + payload + '&pin=' + encodeURIComponent(S.pin) + '&t=' + Date.now(), ctl ? { signal: ctl.signal } : undefined)
    : fetch(CONFIG.scriptUrl, Object.assign({ method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pin: S.pin, by: S.me }, payload)) }, ctl ? { signal: ctl.signal } : {}));
  return req.then(function (r) { return r.text(); }, function () { throw new Error('NET'); }).then(function (t) {
    clearTimeout(timer);
    var d; try { d = JSON.parse(t); } catch (e) { throw new Error('NET'); }
    if (d.code === 'PIN') { S.needPin = true; throw new Error('PIN'); }
    if (!d.success) throw new Error(d.message || 'Failed');
    return d;
  }, function (e) { clearTimeout(timer); throw e; });
}
function saveCache() { try { LS.set('pl_cache', JSON.stringify({ t: S.tasks, v: S.vendors, p: S.payments, g: S.guests, s: S.shagun, f: S.flow, ver: S.ver, v4: S.v4, at: S.lastSync || Date.now() })); } catch (e) {} }
function applyData(d) {
  S.tasks = d.tasks || []; S.vendors = d.vendors || []; S.payments = d.payments || []; S.guests = d.guests || []; S.shagun = d.shagun || []; S.flow = d.flow || [];
  S.ver = d.ver || ''; S.loaded = true; S.error = ''; S.needPin = false;
  S.v4 = d.guests !== undefined;       // the Google script has been updated to version 4
}
function needUpdate() {
  return S.v4 === false ? '<div class="card" style="padding:1rem;margin-bottom:1rem;border-color:var(--warn);background:#fff8e6"><b>' + B('One step left', 'एक कदम बाकी') + '</b><div class="rem">' + L('This section needs the new Google script. Paste the new Code.gs into the sheet (Extensions → Apps Script), keep your PIN, then Deploy → Manage deployments → ✏️ → New version → Deploy. See GUIDE-PLANNER.md.', 'इसके लिए नई Google स्क्रिप्ट चाहिए। शीट में नया Code.gs डालें, अपना पिन रखें, फिर Deploy → New version। गाइड देखें।') + '</div></div>' : '';
}
// everything the family changed is shown at once and saved in the background (one by one, kept safe if the internet drops)
var loading = null;
function load(silent, force) {
  if (Q.length) { pump(); return Promise.resolve(); }
  if (loading) return loading;
  loading = api('GET', 'action=all' + (force || !S.ver || !S.loaded ? '' : '&have=' + encodeURIComponent(S.ver))).then(function (d) {
    loading = null; S.offline = false; S.lastSync = Date.now();
    if (Q.length) return;
    if (!d.same) { applyData(d); saveCache(); }
    if (!S.sheet) render(); else renderStatus();
  }).catch(function (e) {
    loading = null;
    if (e.message === 'PIN') { S.loaded = false; render(); return; }
    if (e.message === 'NET') S.offline = true;
    if (!silent || !S.loaded) { S.error = e.message === 'NOURL' ? 'The planner is not connected yet. Paste your /exec link into CONFIG.scriptUrl in index.html.' : L('Could not reach the sheet. Check your internet and tap Refresh.', 'शीट तक नहीं पहुँच पाए। इंटरनेट देखें और ताज़ा करें दबाएँ।'); }
    if (!S.sheet) render(); else renderStatus();
  });
  return loading;
}
function loadRsvp(force) {
  if (!force && S.rsvp && Date.now() - S.rsvpAt < 120000) return;
  S.rsvpAt = Date.now();
  api('GET', 'action=rsvp').then(function (d) { S.rsvp = d.rsvp || []; S.rsvpNote = d.note || ''; LS.set('pl_rsvp', JSON.stringify(S.rsvp)); if (!S.sheet && S.tab === 'guests') render(); }).catch(function () {});
}

/* ---------- the save queue ---------- */
var Q = []; try { Q = JSON.parse(LS.get('pl_q') || '[]') || []; } catch (e) { Q = []; }
var pumping = false, retryT = 0;
function saveQ() { LS.set('pl_q', JSON.stringify(Q)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function enqueue(payload, tmp) { Q.push({ p: Object.assign({ cid: uid() }, payload), tmp: tmp || '' }); saveQ(); saveCache(); pump(); }
function swapId(tmp, real) {
  [S.tasks, S.vendors, S.payments, S.guests, S.shagun, S.flow].forEach(function (arr) { arr.forEach(function (x) { if (x.id === tmp) x.id = real; if (x.vid === tmp) x.vid = real; }); });
  Q.forEach(function (it) { if (it.p.id === tmp) it.p.id = real; if (it.p.fields && it.p.fields.vid === tmp) it.p.fields.vid = real; });
  if (S.sheet) Object.keys(S.sheet).forEach(function (k) { if (S.sheet[k] === tmp) S.sheet[k] = real; });
}
function pump() {
  if (pumping || !Q.length) { renderStatus(); return; }
  pumping = true; renderStatus();
  var item = Q[0];
  api('POST', item.p).then(function (d) {
    pumping = false; S.offline = false;
    Q.shift(); if (item.tmp && d.id) swapId(item.tmp, d.id);
    saveQ(); saveCache();
    if (Q.length) pump(); else { renderStatus(); load(true); }
  }).catch(function (e) {
    pumping = false;
    if (e.message === 'NET') { S.offline = true; renderStatus(); clearTimeout(retryT); retryT = setTimeout(pump, 10000); return; }   // keep it; try again soon
    Q.shift(); saveQ();
    toast(e.message === 'PIN' ? L('Wrong PIN', 'पिन ग़लत है') : L('Not saved — ', 'सेव नहीं हुआ — ') + e.message, true);
    if (Q.length) pump(); else load(false, true);
  });
}
window.addEventListener('online', function () { S.offline = false; pump(); load(true); });

function renderStatus() {
  var p = document.getElementById('netPill'); if (!p) return;
  if (Q.length && (S.offline || !navigator.onLine)) { p.style.display = ''; p.className = 'netpill off'; p.textContent = '📴 ' + Q.length; p.title = L('Waiting for internet', 'इंटरनेट का इंतज़ार'); }
  else if (Q.length) { p.style.display = ''; p.className = 'netpill'; p.textContent = '⏳ ' + Q.length; p.title = L('Saving', 'सेव हो रहा है'); }
  else if (S.offline) { p.style.display = ''; p.className = 'netpill off'; p.textContent = '📴 ' + L('Offline', 'ऑफ़लाइन'); }
  else p.style.display = 'none';
  var s = document.getElementById('syncLine'); if (s) s.innerHTML = syncText();
}
function syncText() { return (Q.length ? L('Saving…', 'सेव हो रहा है…') : L('Updated ', 'अपडेट ') + (S.lastSync ? new Date(S.lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '')) + ' · <a href="#" data-act="refresh" style="color:inherit">' + B('Refresh', 'ताज़ा करें') + '</a>'; }
function toast(msg, err, undoId) { S.toast = { msg: msg, err: err, undo: undoId }; renderToast(); clearTimeout(toast.t); toast.t = setTimeout(function () { S.toast = null; renderToast(); }, undoId ? 7000 : err ? 4500 : 1800); }
function renderToast() {
  var el = document.getElementById('toast'); if (el) el.remove();
  if (S.toast) { var d = document.createElement('div'); d.id = 'toast'; d.className = 'toast' + (S.toast.err ? ' err' : ''); d.innerHTML = esc(S.toast.msg) + (S.toast.undo ? '<button data-act="undo" data-id="' + esc(S.toast.undo) + '">' + L('Undo · वापस', 'वापस') + '</button>' : ''); document.body.appendChild(d); }
}

/* ---------- saving: tasks, vendors, payments, guests, shagun, schedule ---------- */
function find(id) { return S.tasks.filter(function (x) { return x.id === id; })[0]; }
function saveFields(id, fields, okMsg, undoId) {
  var t = find(id); if (!t) return;
  Object.keys(fields).forEach(function (k) { t[k] = fields[k]; });
  if (fields.status === 'Completed') t.completedOn = today(); else if (fields.status) t.completedOn = '';
  t.updatedBy = S.me; t.updatedAt = today() + ' 00:00';
  enqueue({ action: 'update', id: id, fields: fields });
  if (okMsg) toast(okMsg, false, undoId);
  render();
}
function mact(payload, apply, ok, tmp) { apply(); enqueue(payload, tmp); if (ok) toast(ok); render(); }
function tableArr(t) { return t === 'guests' ? S.guests : t === 'shagun' ? S.shagun : S.flow; }
function rowSave(table, id, fields, ok) {
  var arr = tableArr(table);
  if (id) { var x = arr.filter(function (r) { return r.id === id; })[0]; if (x) Object.assign(x, fields, { by: S.me }); enqueue({ action: 'rowUpdate', table: table, id: id, fields: fields }); }
  else { var tmp = 'tmp' + uid(); arr.push(Object.assign({ id: tmp, by: S.me, at: today() }, fields)); enqueue({ action: 'rowAdd', table: table, fields: fields }, tmp); }
  if (ok) toast(ok); render();
}
function rowDel(table, id, ok) {
  var arr = tableArr(table), i = arr.findIndex(function (r) { return r.id === id; }); if (i >= 0) arr.splice(i, 1);
  enqueue({ action: 'rowDelete', table: table, id: id }); if (ok) toast(ok); render();
}

/* ---------- helpers ---------- */
var PR = { P0: 0, P1: 1, P2: 2 };
function sortTasks(a, b) { var da = a.due || '9999', db = b.due || '9999'; return da < db ? -1 : da > db ? 1 : (PR[a.priority] || 1) - (PR[b.priority] || 1) || (a.task < b.task ? -1 : 1); }
function open(t) { return t.status !== 'Completed'; }
function cats() { var s = {}; S.tasks.forEach(function (t) { s[t.category || 'Other'] = 1; }); return Object.keys(s).sort(); }
function owners() { var s = {}; S.tasks.forEach(function (t) { if (t.owner) s[t.owner] = 1; }); return Object.keys(s).sort(); }
function ownerOptions() { return owners().concat(CONFIG.people).filter(function (v, i, a) { return a.indexOf(v) === i; }); }
function doneDay(t) { return (t.status === 'Completed' ? (t.completedOn || t.updatedAt || '') : (t.updatedAt || '')).slice(0, 10); }
function fnHi(n) { var f = FUNCTIONS.filter(function (x) { return x.n === n; })[0]; return f ? f.hi : n; }
function waLink(phone, text) { var d = digits(phone); if (d.length === 10) d = '91' + d; return 'https://wa.me/' + (d.length >= 11 ? d : '') + '?text=' + encodeURIComponent(text); }
function telLink(phone) { var d = String(phone || '').replace(/[^\d+]/g, ''); return d.length >= 8 ? 'tel:' + d : ''; }
function callBtns(phone, waText) {
  var t = telLink(phone); if (!t) return '';
  return '<a class="call" href="' + esc(t) + '" data-stop="1">📞 ' + B('Call', 'कॉल') + '</a><a class="call wa" href="' + esc(waLink(phone, waText || '')) + '" target="_blank" rel="noopener" data-stop="1">💬 WhatsApp</a>';
}

function dueChip(t) {
  if (!t.due) return '';
  var d = diff(t.due), c = 'pill due';
  if (open(t) && d < 0) c += ' over'; else if (open(t) && d <= 3) c += ' soon';
  var lbl = d === 0 ? L('Today', 'आज') : d === 1 ? L('Tomorrow', 'कल') : d < 0 ? Math.abs(d) + L(' days late', ' दिन देर') : niceDate(t.due);
  return '<span class="' + c + '">' + (open(t) && d < 0 ? '⚠ ' : '📅 ') + lbl + '</span>';
}
function prioPill(t) { var p = (t.priority || 'P1'); return '<span class="pill p' + p.slice(1) + '">' + (PRIO[p] ? L(PRIO[p].en, PRIO[p].hi) : p) + '</span>'; }
function taskRow(t, showCat, started) {
  var isDone = t.status === 'Completed';
  return '<div class="task ' + (isDone ? 'done-t' : '') + '" data-act="edit" data-id="' + esc(t.id) + '">' +
    '<div class="t">' + esc(t.task) + '</div>' +
    '<div class="meta">' + prioPill(t) + dueChip(t) +
    (t.status === 'In Progress' ? '<span class="pill" style="background:#fff3da;color:#8a5a00">' + L('In progress', 'चल रहा है') + '</span>' : '') +
    (t.owner ? '<span>👤 ' + esc(t.owner) + '</span>' : '') + (showCat === 'fn' ? '<span>' + esc(L(t.fn || 'Before the wedding', fnHi(t.fn || 'Before the wedding'))) + '</span>' : showCat ? '<span>' + esc(t.category) + '</span>' : '') + '</div>' +
    (t.remarks ? '<div class="rem">' + esc(t.remarks) + '</div>' : '') +
    (isDone ? '<div style="margin-top:.5rem"><span class="doneTag">✓ ' + B('Done', 'पूरा हुआ') + (t.completedOn ? ' · ' + niceDate(t.completedOn) : '') + '</span></div>'
      : '<div><button class="doneBtn" data-act="askdone" data-id="' + esc(t.id) + '">✓ ' + B('Done', 'पूरा हुआ') + '</button>' +
        (started && t.status === 'Pending' ? '<button class="progBtn" data-act="started" data-id="' + esc(t.id) + '">▶ ' + B('Started', 'शुरू किया') + '</button>' : '') + '</div>') + '</div>';
}
function list(arr, showCat, empty) { return arr.length ? '<div class="card">' + arr.map(function (t) { return taskRow(t, showCat); }).join('') + '</div>' : (empty ? '<div class="card empty">' + empty + '</div>' : ''); }
function chip(act, val, label, on) { return '<button class="chip ' + (on ? 'on' : '') + '" data-act="' + act + '" data-v="' + esc(val) + '">' + label + '</button>'; }

/* ---------- install as an app ---------- */
var installEvt = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; if (!S.sheet) render(); });
window.addEventListener('appinstalled', function () { installEvt = null; LS.set('pl_installed', '1'); toast(L('Installed ✓ — open it from your home screen', 'ऐप जुड़ गया ✓ — होम स्क्रीन से खोलें')); render(); });
function isStandalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function canOfferInstall() { return !isStandalone() && (installEvt || isIOS() || /android/i.test(navigator.userAgent)); }
function installCard() {

    '<div class="acts"><button class="btn sm" data-act="install">' + B('Install', 'ऐप जोड़ें') + '</button><button class="chip" data-act="hideinstall">' + L('Later', 'बाद में') + '</button></div></div></div>';

  S.sheet = { help: 1 };

    : '<li>' + L('Open this page in <b>Chrome</b>.', 'यह पेज <b>Chrome</b> में खोलें।') + '</li><li>' + L('Tap the <b>⋮</b> menu at the top right.', 'ऊपर दाईं ओर <b>⋮</b> मेनू दबाएँ।') + '</li><li>' + L('Choose <b>Install app</b> or <b>Add to Home screen</b>.', '<b>Install app</b> या <b>Add to Home screen</b> चुनें।') + '</li>') +

}

/* ---------- TODAY ---------- */
function viewToday() {
  var all = S.tasks, done = all.filter(function (t) { return !open(t); }).length, pct = all.length ? Math.round(done / all.length * 100) : 0;
  var left = diff(CONFIG.weddingDate), p0 = all.filter(function (t) { return open(t) && t.priority === 'P0'; });
  var over = all.filter(function (t) { return open(t) && t.due && diff(t.due) < 0; }).sort(sortTasks);
  var week = all.filter(function (t) { return open(t) && t.due && diff(t.due) >= 0 && diff(t.due) <= 7; }).sort(sortTasks);
  var shown = {}; over.concat(week).forEach(function (t) { shown[t.id] = 1; });
  var crit = p0.filter(function (t) { return !shown[t.id]; }).sort(sortTasks);
  var nodate = all.filter(function (t) { return open(t) && !t.due; }).length;
  var mine = all.filter(function (t) { return open(t) && t.owner && S.me && t.owner.toLowerCase() === S.me.toLowerCase(); });
  var h = '<p style="margin:.2rem .2rem .8rem;font-size:1.15rem">🙏 <b>' + L('Namaste', 'नमस्ते') + ', ' + esc(S.me) + '</b></p>';
  h += '<div class="hero"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:1rem"><div><div class="sub">' + esc(CONFIG.weddingTitle) + '</div><div class="big">' +
    (left > 0 ? left : left === 0 ? '🎉' : '✓') + '</div><div class="sub">' + (left > 0 ? B('days to go', 'दिन बाकी') : left === 0 ? B('It is the big day!', 'आज शादी है!') : B('Wedding done — congratulations!', 'शादी हो गई — बधाई!')) + '</div></div>' +
    '<div style="text-align:right"><div class="big" style="font-size:2.2rem">' + pct + '%</div><div class="sub">' + B('done', 'पूरा') + '</div></div></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="sub">' + L(done + ' of ' + all.length + ' tasks completed', all.length + ' में से ' + done + ' काम पूरे') + '</div>' +
    '<div class="stats"><div class="stat"><b>' + p0.length + '</b> ' + L('critical open', 'बहुत ज़रूरी बाकी') + '</div><div class="stat"><b>' + over.length + '</b> ' + L('late', 'देर') + '</div><div class="stat"><b>' + week.length + '</b> ' + L('this week', 'इस हफ़्ते') + '</div></div></div>';
  h += installCard();
  // guests arriving soon + what is next on the schedule (during the wedding days)
  var arr0 = S.guests.filter(function (g) { return g.arrDate === today(); }), arr1 = S.guests.filter(function (g) { return g.arrDate && diff(g.arrDate) === 1; });
  if (arr0.length || arr1.length) h += '<div class="tiles">' + (arr0.length ? '<button class="tile" data-act="goarr"><b>' + people(arr0) + '</b><span>' + L('arriving today', 'आज आ रहे हैं') + ' · ' + arr0.length + ' ' + L('families', 'परिवार') + '</span></button>' : '') + (arr1.length ? '<button class="tile" data-act="goarr"><b>' + people(arr1) + '</b><span>' + L('arriving tomorrow', 'कल आ रहे हैं') + ' · ' + arr1.length + ' ' + L('families', 'परिवार') + '</span></button>' : '') + '</div>';
  var nx = nextFlow(); if (nx) h += '<div class="card" style="padding:.2rem 0;margin-top:1rem" ><div class="catHead" style="border-radius:1rem 1rem 0 0">' + B('Next on the schedule', 'आगे का कार्यक्रम') + '</div>' + flowRow(nx) + '<button class="seeall" data-act="tab" data-v="sched">' + B('Full schedule', 'पूरा कार्यक्रम') + ' →</button></div>';
  h += '<button class="addbig" data-act="add">＋ ' + B('Add a new task', 'नया काम जोड़ें') + '</button>';
  if (mine.length) h += '<h2 class="sec">' + B('Given to you', 'आपके काम') + ' <span class="n">' + mine.length + '</span></h2>' + list(mine.sort(sortTasks).slice(0, 8), true) + (mine.length > 8 ? '<button class="seeall card" style="margin-top:.4rem" data-act="gomine">' + B('See all ' + mine.length, 'सभी ' + mine.length + ' देखें') + ' →</button>' : '');

function calcSplit() {
  var r = { A: 0, B: 0, fam: 0, fairS: 0, shared: [], personal: [], pendingShared: 0, persS: 0, persV: 0, persF: 0, setS: 0, setV: 0 };

    r.shared.push(v); r.A += ps.Shrijeet; r.B += ps.Shivangi; r.fam += ps.Family; r.fairS += (ps.Shrijeet + ps.Shivangi) * v.pct / 100;
    r.pendingShared += Math.max(0, v.quoted - ps.total);

  S.payments.forEach(function (p) { if (p.vid === 'SETTLE') { if (p.by === 'Shivangi') r.setV += num(p.amount); else if (p.by === 'Shrijeet') r.setS += num(p.amount); } });
  r.T = r.A + r.B; r.fairV = r.T - r.fairS;
  r.net = r.A - r.fairS - r.setV + r.setS;      // >0 : Shivangi owes Shrijeet
  return r;
}

function flowSorted() { return S.flow.slice().sort(function (a, b) { return (a.date || '9') < (b.date || '9') ? -1 : (a.date || '9') > (b.date || '9') ? 1 : flowMin(a) - flowMin(b); }); }
function flowMin(f) { if (!f.start) return 9999; var p = f.start.split(':'), m = +p[0] * 60 + (+p[1] || 0); return m < 300 ? m + 1440 : m; }   // after-midnight rituals (e.g. 2:30 AM) stay with the night before

function flowState(f) {

  if (d < 0 && !(d === -1 && m < 300 && flowMin(f) >= 1440)) return 'past';
  if (d === 0 || (d === -1 && m < 300)) { var mm = d === 0 ? m : m + 1440, end = f.end ? flowMinEnd(f) : flowMin(f) + 60; if (mm >= flowMin(f) && mm < end) return 'now'; if (mm >= end) return 'past'; }
  return '';
}
function flowMinEnd(f) { var p = f.end.split(':'), m = +p[0] * 60 + (+p[1] || 0); if (m < 300) m += 1440; return m < flowMin(f) ? m + 1440 : m; }

var MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
function dateWords(d) {

var STATUS_WORDS = { 'Pending': 'pending not started baaki बाकी', 'In Progress': 'in progress started chal raha', 'Completed': 'done completed complete finished पूरा' };

function vendorHay(v) { return (v.category + ' ' + v.vendor + ' ' + v.contact + ' ' + v.deliverables + ' ' + v.remarks + ' ' + v.status).toLowerCase(); }
function guestHay(g) { return (g.name + ' ' + g.phone + ' ' + g.group + ' ' + g.side + ' ' + g.stay + ' ' + g.room + ' ' + g.arrMode + ' ' + g.pickupBy + ' ' + g.remarks + ' ' + dateWords(g.arrDate)).toLowerCase(); }

function viewSearch() {
  var words = S.gq.trim().toLowerCase().split(/\s+/).filter(Boolean), first = words[0];

    var ta = a.task.toLowerCase().indexOf(first) >= 0 ? 0 : 1, tb = b.task.toLowerCase().indexOf(first) >= 0 ? 0 : 1; if (ta !== tb) return ta - tb;

    case 'setlang':
      S.lang = v; LS.set('pl_lang', v);
      if (S.sheet && S.sheet.settings) { var typed = val('st_me'); openSettings(); applyLang(); document.getElementById('st_me').value = typed; return; }
      var gp1 = document.getElementById('gpin'), gm1 = document.getElementById('gme'), kp = gp1 ? gp1.value : null, km = gm1 ? gm1.value : null;
      render();
      if (kp !== null && document.getElementById('gpin')) document.getElementById('gpin').value = kp;
      if (km !== null && document.getElementById('gme')) document.getElementById('gme').value = km;
      return;
    case 'settings': openSettings(); return;
    case 'install': closeSheet(true); S.sheet = null; doInstall(); return;
    case 'hideinstall': LS.set('pl_hideinstall', '1'); render(); return;
    case 'logout': LS.set('pl_pin', ''); LS.set('pl_me', ''); S.pin = ''; S.me = ''; closeSheet(); return;
    case 'savesettings': var nm = val('st_me'); if (!nm) { toast(L('Please enter your name', 'कृपया नाम लिखें'), true); return; } S.me = nm; LS.set('pl_me', nm); closeSheet(); toast(L('Saved ✓', 'सेव हुआ ✓')); return;
    case 'enter':
      var pe = document.getElementById('gpin'), me = val('gme');
      if (pe) S.pin = pe.value.trim();
      if (!S.pin) { toast(L('Please enter the PIN', 'कृपया पिन लिखें'), true); return; }
      if (!me) { toast(L('Please enter your name', 'कृपया नाम लिखें'), true); return; }
      S.me = me; LS.set('pl_pin', S.pin); LS.set('pl_me', S.me); S.needPin = false; S.error = ''; render(); load(false, true); return;
    case 'saveedit':
      var t2 = find(S.sheet.id), f = {};
      var nv = { status: segVal('e_status'), priority: segVal('e_prio'), owner: val('e_owner'), due: document.getElementById('e_due').value, fn: document.getElementById('e_fn').value, remarks: val('e_rem'), vendor: val('e_vendor') };
      Object.keys(nv).forEach(function (k) { if ((t2[k] || '') !== nv[k]) f[k] = nv[k]; });
      var sid = S.sheet.id; closeSheet(true); S.sheet = null;
      if (Object.keys(f).length) saveFields(sid, f, L('Saved ✓', 'सेव हुआ ✓')); else render(); return;
    case 'saveadd':
      var task = val('a_task'); if (!task) { toast(L('Please type the task', 'कृपया काम लिखें'), true); return; }
      var fields = { task: task, category: val('a_cat'), priority: segVal('a_prio') || 'P1', fn: document.getElementById('a_fn').value, owner: val('a_owner'), due: document.getElementById('a_due').value, remarks: val('a_rem') };
      closeSheet(true); S.sheet = null;
      var tmp = 'tmp' + uid();
      S.tasks.push({ id: tmp, category: fields.category || 'Other', task: fields.task, status: 'Pending', priority: fields.priority, vendor: '', cost: '', remarks: fields.remarks, planAhead: '', owner: fields.owner, due: fields.due, fn: fields.fn, completedOn: '', updatedBy: S.me, updatedAt: today() + ' 00:00' });
      enqueue({ action: 'add', fields: fields }, tmp); toast(L('Task added ✓', 'काम जुड़ गया ✓')); render(); return;
    /* money */
    case 'addvendor': openVendor(''); return;
    case 'editvendor': openVendor(id); return;
    case 'savevendor':
      var vf = { category: val('v_cat'), vendor: val('v_name'), quoted: num(val('v_q')), split: segVal('v_split') || 'Shared', pct: Math.min(100, Math.max(0, num(val('v_pct')))), contact: val('v_con'), deliverables: val('v_del'), remarks: val('v_rem') };
      if (!vf.category && !vf.vendor) { toast(L('Please type the item or vendor name', 'कृपया नाम लिखें'), true); return; }
      closeSheet(true); S.sheet = null;
      if (id) { var cur = findV(id); mact({ action: 'vendorUpdate', id: id, fields: vf }, function () { Object.keys(vf).forEach(function (k) { cur[k] = vf[k]; }); }, L('Saved ✓', 'सेव हुआ ✓')); }
      else { var vt = 'tmp' + uid(); mact({ action: 'vendorAdd', fields: vf }, function () { S.vendors.push(Object.assign({ id: vt, advance: 0, balance: vf.quoted, status: '' }, vf)); }, L('Added ✓', 'जुड़ गया ✓'), vt); }
      return;
    case 'delvendor': var dv = findV(id); S.sheet = { confirmDelV: id }; confirmBox(B('Delete this vendor?', 'क्या यह हटाना है?'), dv ? (dv.vendor || dv.category) : '', L('Its payments will be deleted too. This cannot be undone.', 'इसके भुगतान भी हट जाएँगे।'), 'confirmdelv', id); return;
    case 'confirmdelv': closeSheet(true); S.sheet = null; mact({ action: 'vendorDelete', id: id }, function () { S.vendors = S.vendors.filter(function (x) { return x.id !== id; }); S.payments = S.payments.filter(function (x) { return x.vid !== id; }); }, L('Deleted', 'हटा दिया')); return;
    case 'setsplit': e.stopPropagation(); var sv = findV(id); if (!sv || sv.split === v) return; mact({ action: 'vendorUpdate', id: id, fields: { split: v } }, function () { sv.split = v; }, v === 'Personal' ? L('Marked personal — not divided', 'अपना — नहीं बँटेगा') : L('Marked shared', 'साझा')); return;
    case 'addpay': openPay(id, '', !!el.getAttribute('data-back')); return;
    case 'editpay': var pp = S.payments.filter(function (x) { return x.id === id; })[0]; if (pp) openPay(pp.vid, id, S.sheet && S.sheet.vendor); return;
    case 'savepay':
      var amt = num(val('p_amt')); if (!amt) { toast(L('Please enter the amount', 'कृपया रकम लिखें'), true); return; }
      var pf = { amount: amt, by: segVal('p_by') || 'Shrijeet', date: document.getElementById('p_date').value || today(), note: val('p_note') };
      var sh = S.sheet, vid = sh.pay, backId = sh.back; closeSheet(true); S.sheet = null;
      if (sh.payId) { var ex = S.payments.filter(function (x) { return x.id === sh.payId; })[0]; mact({ action: 'payUpdate', id: sh.payId, fields: pf }, function () { if (ex) Object.keys(pf).forEach(function (k) { ex[k] = pf[k]; }); }, L('Saved ✓', 'सेव हुआ ✓')); }
      else { var pt = 'tmp' + uid(); mact({ action: 'payAdd', fields: Object.assign({ vid: vid }, pf) }, function () { S.payments.push(Object.assign({ id: pt, vid: vid, addedBy: S.me }, pf)); }, L('Payment added ✓', 'भुगतान जुड़ गया ✓'), pt); }
      if (backId) setTimeout(function () { openVendor(backId); }, 0);
      return;
    case 'delpay':
      var dp = S.payments.filter(function (x) { return x.id === id; })[0], backId2 = S.sheet && S.sheet.back; closeSheet(true); S.sheet = null;
      mact({ action: 'payDelete', id: id }, function () { S.payments = S.payments.filter(function (x) { return x.id !== id; }); }, L('Deleted', 'हटा दिया'));
      if (backId2 && dp && dp.vid !== 'SETTLE') setTimeout(function () { openVendor(backId2); }, 0);
      return;
    case 'settle': openSettle(''); return;
    case 'editsettle': openSettle(id); return;
    case 'savesettle':
      var sa = num(val('s_amt')); if (!sa) { toast(L('Please enter the amount', 'कृपया रकम लिखें'), true); return; }
      var sf = { amount: sa, by: segVal('s_by') || 'Shivangi', date: document.getElementById('s_date').value || today(), note: val('s_note') }, sid2 = S.sheet.settle; closeSheet(true); S.sheet = null;
      if (sid2 && sid2 !== 'new') { var se = S.payments.filter(function (x) { return x.id === sid2; })[0]; mact({ action: 'payUpdate', id: sid2, fields: sf }, function () { if (se) Object.keys(sf).forEach(function (k) { se[k] = sf[k]; }); }, L('Saved ✓', 'सेव हुआ ✓')); }
      else { var st = 'tmp' + uid(); mact({ action: 'payAdd', fields: Object.assign({ vid: 'SETTLE' }, sf) }, function () { S.payments.push(Object.assign({ id: st, vid: 'SETTLE', addedBy: S.me }, sf)); }, L('Settlement noted ✓', 'चुकता लिखा ✓'), st); }
      return;
    /* guests */
    case 'addguest': openGuest(''); return;
    case 'editguest': openGuest(id); return;
    case 'rsvpadd': rsvpToGuest(v); return;
    case 'saveguest':
      var gf = { name: val('g_name'), phone: val('g_phone'), side: segVal('g_side'), adults: val('g_ad'), children: val('g_ch'), group: val('g_group'), arrDate: document.getElementById('g_ad8').value, arrTime: document.getElementById('g_at').value, arrMode: segVal('g_mode'), depDate: document.getElementById('g_dep').value, roomReq: segVal('g_rr'), stay: val('g_stay'), room: val('g_room'), vehicle: segVal('g_veh'), pickupBy: val('g_pick'), remarks: val('g_rem') };
      if (!gf.name) { toast(L('Please type the name', 'कृपया नाम लिखें'), true); return; }
      if (!id && S.sheet.rsvp) gf.rsvp = S.sheet.rsvp;
      closeSheet(true); S.sheet = null; rowSave('guests', id, gf, id ? L('Saved ✓', 'सेव हुआ ✓') : L('Guest added ✓', 'मेहमान जुड़ गए ✓')); return;
    case 'delguest': var dg = S.guests.filter(function (x) { return x.id === id; })[0]; S.sheet = { confirm: 1 }; confirmBox(B('Delete this guest?', 'क्या यह मेहमान हटाना है?'), dg ? dg.name : '', '', 'confirmdelg', id); return;
    case 'confirmdelg': closeSheet(true); S.sheet = null; rowDel('guests', id, L('Deleted', 'हटा दिया')); return;
    /* shagun */
    case 'addshagun': openShagun(''); return;
    case 'editshagun': openShagun(id); return;
    case 'saveshagun':
      var hf = { type: segVal('h_type') || 'Received', name: val('h_name'), relation: val('h_rel'), kind: segVal('h_kind') || 'Cash', amount: val('h_amt'), item: val('h_item'), side: segVal('h_side'), date: document.getElementById('h_date').value, note: val('h_note') };
      if (!hf.name) { toast(L('Please type the name', 'कृपया नाम लिखें'), true); return; }
      closeSheet(true); S.sheet = null; S.stype = hf.type; rowSave('shagun', id, hf, L('Written ✓', 'लिख लिया ✓')); return;
    case 'delshagun': var ds = S.shagun.filter(function (x) { return x.id === id; })[0]; S.sheet = { confirm: 1 }; confirmBox(B('Delete this entry?', 'क्या यह हटाना है?'), ds ? ds.name : '', '', 'confirmdels', id); return;
    case 'confirmdels': closeSheet(true); S.sheet = null; rowDel('shagun', id, L('Deleted', 'हटा दिया')); return;
    /* schedule */
    case 'addflow': openFlow(''); return;
    case 'editflow': openFlow(id); return;
    case 'saveflow':
      var ff = { what: val('f_what'), fn: document.getElementById('f_fn').value, date: document.getElementById('f_date').value, start: document.getElementById('f_start').value, end: document.getElementById('f_end').value, people: val('f_people'), venue: val('f_venue'), coord: val('f_coord'), song: val('f_song'), photo: val('f_photo'), remarks: val('f_rem') };
      if (!ff.what) { toast(L('Please type what happens', 'कृपया लिखें क्या होगा'), true); return; }
      closeSheet(true); S.sheet = null; rowSave('flow', id, ff, L('Saved ✓', 'सेव हुआ ✓')); return;
    case 'delflow': var df = S.flow.filter(function (x) { return x.id === id; })[0]; S.sheet = { confirm: 1 }; confirmBox(B('Delete from the schedule?', 'क्या यह हटाना है?'), df ? df.what : '', '', 'confirmdelf', id); return;
    case 'confirmdelf': closeSheet(true); S.sheet = null; rowDel('flow', id, L('Deleted', 'हटा दिया')); return;
  }
});
var searchT = 0;
document.addEventListener('input', function (e) {
  if (e.target.id === 'gq') { S.gq = e.target.value; clearTimeout(searchT); searchT = setTimeout(function () { render(); window.scrollTo(0, 0); }, 120); }
  if (e.target.id === 'sq') { S.sq = e.target.value; clearTimeout(searchT); searchT = setTimeout(function () { var pos = e.target.selectionStart; render(); var i = document.getElementById('sq'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } }, 150); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'fcat') { S.fCat = e.target.value; render(); }
  if (e.target.id === 'fown') { S.fOwner = e.target.value; render(); }
});
setInterval(function () { if (!document.hidden && S.loaded && !S.sheet && S.pin && S.me) load(true); }, 30000);
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.loaded && S.pin && S.me) { pump(); if (!S.sheet) load(true); } });

/* ---------- start: show the last saved plan at once, then check for changes ---------- */
(function () {
  if (!S.pin || !S.me) return;
  try {
    var c = JSON.parse(LS.get('pl_cache') || 'null');
    if (c && c.t && c.t.length) { S.tasks = c.t; S.vendors = c.v || []; S.payments = c.p || []; S.guests = c.g || []; S.shagun = c.s || []; S.flow = c.f || []; S.ver = c.ver || ''; S.v4 = c.v4; S.loaded = true; S.lastSync = c.at || 0; }
    var r = JSON.parse(LS.get('pl_rsvp') || 'null'); if (r) S.rsvp = r;
  } catch (e) {}
})();
render();
if (S.pin && S.me) { if (Q.length) pump(); else load(true); }
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
</script>
