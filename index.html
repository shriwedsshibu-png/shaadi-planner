<style>
.hi{font-family:'Noto Sans Devanagari','Lora',sans-serif;font-weight:700}

.hero .money div{background:rgba(0,0,0,.2);color:#f1e2c4}.hero .money b{color:#ffe2a3}
.money .bal b{color:var(--bad)}.money .bal.zero b{color:var(--ok)}
.acts{display:flex;gap:.45rem;align-items:center;margin-top:.6rem;flex-wrap:wrap}
a.call,button.call{display:inline-block;text-align:center;line-height:1.35;color:var(--maroon);font-weight:700;text-decoration:none;border:1.5px solid var(--maroon);border-radius:99px;padding:.35rem .9rem;font-size:.9rem;background:#fff;cursor:pointer;min-height:2.4rem}
a.wa,button.wa{color:#1f7a3f;border-color:#1f7a3f}
.doneBtn{margin-top:.55rem;border:2px solid var(--ok);background:#fff;color:var(--ok);border-radius:.9rem;padding:.6rem 1rem;font-weight:700;cursor:pointer;min-height:3rem;display:inline-flex;align-items:center;gap:.5rem}
.doneBtn:active{background:var(--ok);color:#fff}
.progBtn{margin-top:.55rem;margin-left:.5rem;border:2px solid var(--warn);background:#fff;color:#8a5a00;border-radius:.9rem;padding:.6rem 1rem;font-weight:700;cursor:pointer;min-height:3rem}
.doneTag{display:inline-flex;align-items:center;gap:.35rem;background:#e7f4e8;color:var(--ok);border-radius:99px;padding:.15rem .7rem;font-weight:700;font-size:.8rem}
.addbig{width:100%;margin-top:1rem;background:linear-gradient(180deg,#e0bb6a,#b8893b);color:#3b1a1a;border:1.5px solid #f1d99a;border-radius:1rem;padding:.9rem;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 16px rgba(143,106,38,.3)}
.sub2{display:block;font-size:.72em;opacity:.85;font-weight:600}
.last-h{padding:.55rem .9rem;background:#fff3da;color:#8a5a00;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
.modal{background:var(--ivory);width:min(92vw,26rem);border-radius:1.2rem;padding:1.3rem;border-top:4px solid var(--ok);margin:auto 0}
.sheetbg.center{align-items:center}
.sbar{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top));z-index:29;background:var(--ivory);padding:.6rem 1rem;border-bottom:1px solid rgba(184,137,59,.35);box-shadow:0 4px 10px rgba(74,17,32,.06)}
.sbar .in{max-width:46rem;margin:0 auto;position:relative}
#gq{padding-left:2.7rem;padding-right:3rem;border-radius:99px;min-height:3.1rem;border-color:var(--gold)}
.sbar .si{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1.1rem;pointer-events:none}
.sbar .sx{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:var(--cream);color:var(--maroon);font-size:1.1rem;cursor:pointer;display:none}
.res-note{font-size:.9rem;color:var(--muted);margin:.3rem .2rem .6rem}
.seeall{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #eadcc0;padding:.8rem 1rem;color:var(--maroon);font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
.delbtn{display:block;width:100%;margin-top:1rem;background:none;border:2px solid #c0392b;color:#c0392b;border-radius:.9rem;padding:.8rem;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;min-height:3rem}
.seg2{display:flex;gap:.4rem;margin-top:.5rem}.seg2 button{flex:1;border:2px solid #d9c79c;background:#fff;color:var(--maroon);border-radius:.8rem;padding:.55rem;font-weight:700;cursor:pointer;min-height:2.8rem;font-family:inherit;font-size:.95rem}.seg2 button.on{background:var(--maroon);color:#fff7e6;border-color:var(--maroon)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-top:.8rem}
.tile{background:#fffdf9;border:1px solid rgba(184,137,59,.4);border-radius:1rem;padding:.8rem;text-align:left;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(74,17,32,.06)}
.tile b{display:block;font-family:'Cormorant Garamond',serif;font-size:2rem;line-height:1;color:var(--maroon)}
.tile span{font-size:.85rem;color:var(--muted)}
.tile.warn b{color:var(--bad)}
.badge{display:inline-block;border-radius:99px;padding:.05rem .55rem;font-size:.72rem;font-weight:700}
.b-ok{background:#e3f0e6;color:#2a6a38}.b-no{background:#fde8e6;color:var(--bad)}.b-warn{background:#fff3da;color:#8a5a00}.b-info{background:#efe6f7;color:#5b3a82}
.flow{display:flex;gap:.8rem;padding:.8rem;border-bottom:1px solid rgba(184,137,59,.2);cursor:pointer}
.flow:last-child{border-bottom:0}
.flow .tm{flex:none;width:4.4rem;font-family:'Cinzel',serif;font-weight:700;color:var(--maroon);font-size:.95rem;line-height:1.2}
.flow .tm small{display:block;font-family:'Lora',serif;font-weight:500;color:var(--muted);font-size:.75rem}
.flow.now{background:#fff3da}.flow.past{opacity:.55}
.install{display:flex;gap:.8rem;align-items:center;padding:.9rem 1rem;margin-top:1rem;border:1.5px solid var(--gold);background:linear-gradient(180deg,#fff8e8,#fff1d6)}
.install .ic{font-size:1.8rem}
.steps{margin:.5rem 0 0;padding-left:1.2rem}.steps li{margin:.45rem 0}

/* ---------- the look of the wedding invitation: navy, gold, blush and ivory paper ---------- */
:root{--maroon:#1f3350;--maroon-d:#16263d;--gold:#b8893b;--blush:#f6d9d4;--navy:#1f3350}
body{background:#fbf6ee linear-gradient(180deg,#f8e9e4 0,#fbf6ee 22rem) no-repeat}
body.gatebg{padding-bottom:2rem}
header.top{background:linear-gradient(180deg,#2a4467,#16263d);color:#f1d68e;border-bottom:1.5px solid #c9a24a;box-shadow:0 4px 14px rgba(15,25,45,.25)}
header.top::after{content:'';position:absolute;left:0;right:0;top:100%;height:26px;background:url(/img/toran.webp) repeat-x center top/auto 26px;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(60,30,10,.25))}
header.top h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:1.75rem;letter-spacing:0;color:#f6dc9a;display:flex;align-items:center;gap:.45rem}

.who{background:rgba(246,220,154,.12);border-color:rgba(246,220,154,.55);color:#f6dc9a}
.sbar{padding-top:calc(.6rem + 18px);background:linear-gradient(180deg,#f7e8e3,#fbf6ee)}
.hero{background:linear-gradient(180deg,rgba(20,32,56,.25),rgba(16,26,46,.78) 75%),url(/img/hero.webp) center 78%/cover;border:1.5px solid #c9a24a;box-shadow:0 10px 26px rgba(20,32,56,.28)}
.hero .big{color:#f6dc9a;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.hero .stat{background:rgba(255,255,255,.1);border-color:rgba(246,220,154,.45);backdrop-filter:blur(2px)}
.hero .stat b,.hero .money b{color:#f6dc9a}
.bar i{background:linear-gradient(90deg,#e7c06a,#fbe4a6)}
h2.sec{color:var(--navy)}
h2.sec::before{content:'❖';color:var(--gold);font-size:.8rem}
.card{border-color:rgba(184,137,59,.32);box-shadow:0 6px 18px rgba(31,51,80,.07)}
.catHead{background:linear-gradient(180deg,#fbeee9,#f6e6dc);color:var(--navy)}
nav.bottom{background:linear-gradient(180deg,#2a4467,#16263d);border-top:1.5px solid #c9a24a}
nav.bottom button{color:#d8e0ec}
nav.bottom button.on{color:#f6dc9a;box-shadow:inset 0 3px 0 #f6dc9a;background:rgba(246,220,154,.08)}
.btn{background:linear-gradient(180deg,#2c4a6e,#1f3350);border-color:#c9a24a}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--navy)}
.addbig{background:linear-gradient(180deg,#f0d38a,#c99a45);color:#2a1d0c;border-color:#f6dfa2}
.chip.on,.seg button.on,.seg2 button.on{background:var(--navy);border-color:var(--navy);color:#fbf3e6}
.tile b,.amt{color:var(--navy)}
.install{background:linear-gradient(180deg,#fff9ef,#fbeee9);border-color:#e2c27a}
.toast{background:#1f3350}
.gatebg{background:#f3e7d6 url(/img/gate.webp) center top/cover fixed}
.gate{background:rgba(255,252,246,.9);backdrop-filter:blur(3px);border:1.5px solid #e2c27a;margin-top:6vh}

.desk-q{min-height:3.6rem!important;font-size:1.15rem!important;border-radius:1rem!important;border:2px solid var(--gold)!important}
.tbl-wrap{overflow-x:auto;margin-top:.6rem}

.tbl th{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:right;padding:.5rem .3rem;border-bottom:1.5px solid #e9d8bd;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:.55rem .3rem;border-bottom:1px solid #f1e5d2;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.tbl tr.sum td{font-weight:800;background:#f6ecdc;color:var(--navy)}
.tbl-title{padding:.8rem .9rem .2rem;font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;color:var(--navy);letter-spacing:.04em}
.tbl-note{padding:0 .9rem .8rem;font-size:.8rem;color:var(--muted)}
@media(max-width:380px){header.top{padding-left:.7rem;padding-right:.7rem}header.top h1{font-size:.8rem;letter-spacing:.03em}.who{padding:.3rem .6rem;max-width:6.5rem;font-size:.8rem}.money b{font-size:.8rem}.money{gap:.25rem}.hero{padding:1rem}nav.bottom button{font-size:.6rem}}
</style>
</head>
<body>
<header class="top" id="hdr" style="display:none"><h1><img src="/img/ganesh.webp" alt="" />Shaadi Planner</h1><div class="hright"><button class="netpill" id="netPill" data-act="netinfo" style="display:none"></button><button class="who" id="whoBtn" data-act="settings" title="Name, language, app"></button></div></header>
<div class="sbar" id="sbar" style="display:none"><div class="in"><span class="si">🔍</span><input class="input" id="gq" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search task, guest, vendor, date…" /><button class="sx" id="gqx" data-act="clearsearch" aria-label="Clear search">✕</button></div></div>
<div id="app"></div>
<script>
/* ============ SETTINGS (the only part you may edit) ============ */
var CONFIG = {
  scriptUrl: "https://script.google.com/macros/s/AKfycbzZyiDscv0WK7REJA9YLGLPqwlBNG036OVvb7C0YJAux4N5C_sXdYd3_pnuRdQ4cA/exec",   // your Web app link (ends with /exec)
  weddingDate: "2026-12-02",     // the big day, used for the countdown
  weddingTitle: "Shrijeet & Shivangi",
  people: ["Shrijeet", "Shivangi", "Mummy", "Papa", "Shristi"],   // quick-pick names on the "Who are you?" screen
  stays: ["Aarif Resort", "Hotel FantaSea", "Bungalow 1", "Bungalow 2", "NOI Rooms", "Command Mess", "HSL Guest Room", "At home"]   // where guests can stay
};
/* ================================================================ */

var FUNCTIONS = [
  { n: 'Before the wedding', hi: 'शादी से पहले', d: '' },
  { n: 'Faldaan', hi: 'फलदान', d: '30 Nov', date: '2026-11-30' },
  { n: 'Mehndi', hi: 'मेहंदी', d: '1 Dec, morning', date: '2026-12-01' },
  { n: 'Engagement & Sangeet', hi: 'सगाई और संगीत', d: '1 Dec, evening', date: '2026-12-01' },
  { n: 'Haldi', hi: 'हल्दी', d: '2 Dec, morning', date: '2026-12-02' },
  { n: 'Varmala & Shaadi', hi: 'वरमाला और शादी', d: '2 Dec night, 7:30 PM onwards', date: '2026-12-02' },
  { n: 'After the wedding', hi: 'शादी के बाद', d: '' }
];
var PRIO = { P0: { en: 'Critical', hi: 'बहुत ज़रूरी' }, P1: { en: 'Important', hi: 'ज़रूरी' }, P2: { en: 'Normal', hi: 'सामान्य' } };
var STATUS = [{ v: 'Pending', en: 'Not started', hi: 'बाकी' }, { v: 'In Progress', en: 'In progress', hi: 'चल रहा है' }, { v: 'Completed', en: 'Done', hi: 'पूरा हुआ' }];
var WHO = ['Shrijeet', 'Shivangi', 'Family'];
var WHO_HI = { Shrijeet: 'श्रीजीत', Shivangi: 'शिवांगी', Family: 'परिवार' };

var $app = document.getElementById('app');
var LS = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
var S = { role: LS.get('pl_role') || '', names: [], dq: '', gq: '', tasks: [], vendors: [], payments: [], guests: [], shagun: [], flow: [], stays: [], alloc: [], rsvp: null, rsvpAt: 0, ver: '', tab: LS.get('pl_tab') || 'today',
  ttab: 'list', vtab: 'list', gtab: 'sum', carMode: LS.get('pl_carmode') || 'bal', stype: 'Received', sq: '', fday: 'all', gpick: false,
  loaded: false, error: '', pin: LS.get('pl_pin'), me: LS.get('pl_me'), lang: LS.get('pl_lang') || 'both',
  fStatus: 'open', fPrio: 'all', fCat: 'all', fOwner: 'all', fDate: 'all', sheet: null, toast: null, lastSync: 0, needPin: false, offline: false };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return ymd(new Date()); }
function dayNum(s) { var p = String(s).slice(0, 10).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
function diff(s) { return dayNum(s) - dayNum(today()); }
function money(n) { return '₹' + Math.round(n || 0).toLocaleString('en-IN'); }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var MON_HI = ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'];
function niceDate(s) { if (!s) return ''; var p = String(s).slice(0, 10).split('-'); return +p[2] + ' ' + (S.lang === 'hi' ? MON_HI[+p[1] - 1] : MON[+p[1] - 1]); }
function niceTime(t) { if (!t) return ''; var p = String(t).split(':'), h = +p[0], m = p[1] || '00'; return (h % 12 || 12) + ':' + m + (h < 12 ? ' AM' : ' PM'); }
function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
function digits(p) { return String(p || '').replace(/\D/g, ''); }
function phonesOf(s) {   // "Sudhir ji 98200 12345, Bhabhi 97000 11111" -> [{name, num, d}]
  var out = [];
  String(s || '').split(/[,;\n\/]+/).forEach(function (part) {
    var m = part.match(/\+?\d[\d\s-]{8,}\d/); if (!m) return;
    var d = digits(m[0]); if (d.length < 10) return;
    out.push({ name: part.replace(m[0], '').replace(/[:()–-]+/g, ' ').replace(/\s+/g, ' ').trim(), num: m[0].trim(), d: d });
  });
  return out;
}
function mainPhone(s) { var p = phonesOf(s); return p.length ? p[0].num : String(s || ''); }
function last10(p) { var d = digits(mainPhone(p)); return d.slice(-10); }
function hasPhone(s, p10) { if (!p10) return false; var l = phonesOf(s); return l.length ? l.some(function (x) { return x.d.slice(-10) === p10; }) : last10(s) === p10; }

/* ---------- words in the guest's language: English + Hindi, Hindi only, or big text ---------- */
function K(en, hi) { return S.lang === 'hi' ? '<span class="hi">' + esc(hi) + '</span>' : esc(en) + ' <span class="hi">· ' + esc(hi) + '</span>'; }    // key buttons Papa needs: English + Hindi
function B(en, hi) { return S.lang === 'hi' ? '<span class="hi">' + esc(hi) + '</span>' : esc(en); }    // everything else: one language (Hindi when Hindi is chosen)
function B2(en, hi) { return S.lang === 'hi' ? '<span class="hi">' + esc(hi) + '</span>' : '<span>' + esc(en) + '</span><span class="sub2 hi">' + esc(hi) + '</span>'; }  // stacked
function L(en, hi) { return S.lang === 'hi' ? hi : en; }   // plain text (toasts, placeholders)
function applyLang() { var h = document.documentElement; h.classList.toggle('big', S.lang === 'big'); h.classList.toggle('hionly', S.lang === 'hi'); h.lang = S.lang === 'hi' ? 'hi' : 'en'; var q = document.getElementById('gq'); if (q) q.placeholder = L('Search task, guest, vendor, date…', 'काम, मेहमान, नाम या तारीख़ खोजें…'); }

/* ---------- network ---------- */
function api(method, payload) {
  if (!CONFIG.scriptUrl) return Promise.reject(new Error('NOURL'));
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, timer = ctl ? setTimeout(function () { ctl.abort(); }, 30000) : 0;
  var req = method === 'GET'
    ? fetch(CONFIG.scriptUrl + '?' + payload + '&pin=' + encodeURIComponent(S.pin) + '&t=' + Date.now(), ctl ? { signal: ctl.signal } : undefined)
    : fetch(CONFIG.scriptUrl, Object.assign({ method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pin: S.pin, by: S.me }, payload)) }, ctl ? { signal: ctl.signal } : {}));
  return req.then(function (r) { return r.text(); }, function () { throw new Error('NET'); }).then(function (t) {
    clearTimeout(timer);
    var d; try { d = JSON.parse(t); } catch (e) { throw new Error('NET'); }
    if (d.code === 'PIN') { S.needPin = true; throw new Error('PIN'); }
    if (!d.success) throw new Error(d.message || 'Failed');
    return d;
  }, function (e) { clearTimeout(timer); throw e; });
}
function saveCache() { try { LS.set('pl_cache', JSON.stringify({ role: S.role, t: S.tasks, v: S.vendors, p: S.payments, g: S.guests, s: S.shagun, f: S.flow, st: S.stays, al: S.alloc, n: S.names, ver: S.ver, v4: S.v4, v5: S.v5, v6: S.v6, at: S.lastSync || Date.now() })); } catch (e) {} }
function applyData(d) {
  var role = d.role === 'shagun' ? 'shagun' : 'family';
  if (S.role && S.role !== role) { S.tasks = []; S.vendors = []; S.payments = []; S.guests = []; S.flow = []; S.rsvp = null; LS.set('pl_rsvp', ''); }
  S.role = role; LS.set('pl_role', role);
  if (role === 'shagun') { S.shagun = d.shagun || []; S.names = d.names || []; S.tasks = []; S.vendors = []; S.payments = []; S.guests = []; S.flow = []; S.ver = d.ver || ''; S.loaded = true; S.error = ''; S.needPin = false; S.v4 = true; S.v5 = true; return; }
  S.tasks = d.tasks || []; S.vendors = d.vendors || []; S.payments = d.payments || []; S.guests = d.guests || []; S.shagun = d.shagun || []; S.flow = d.flow || []; S.stays = d.stays || []; S.alloc = d.alloc || [];
  S.v6 = d.stays !== undefined;        // version 6: room plan
  S.ver = d.ver || ''; S.loaded = true; S.error = ''; S.needPin = false;
  S.v4 = d.guests !== undefined;       // the Google script has been updated to version 4
  S.v5 = Number(d.api) >= 5;           // version 5: invite tracking columns
}
function needUpdate() {
  if (S.v5 !== false) return '';
  // the planner reached the sheet, but the answer came from the OLD script
  return '<div class="card" style="padding:1rem;margin-bottom:1rem;border-color:var(--warn);background:#fff8e6"><b>' + B('The planner is still talking to the old script', 'प्लानर अभी पुरानी स्क्रिप्ट से जुड़ा है') + '</b>' +
    '<div class="rem" style="margin-top:.4rem">' + L('Usually one of these:', 'आमतौर पर इनमें से एक कारण:') + '</div><ol class="steps" style="font-size:.9rem">' +
    '<li>' + L('The new deployment was made with <b>New deployment</b> (it gets a new link). Use <b>Manage deployments → ✏️ (pencil) → Version: New version → Deploy</b> on the existing one instead — or send the new /exec link to be put into the planner.', '<b>New deployment</b> से नया लिंक बन गया। इसके बजाय <b>Manage deployments → ✏️ → New version → Deploy</b> करें, या नया /exec लिंक भेजें।') + '</li>' +
    '<li>' + L('The code was pasted but not <b>saved</b> (💾) before deploying.', 'कोड डालकर <b>Save</b> (💾) नहीं किया गया।') + '</li>' +
    '<li>' + L('It was pasted into the wedding website\'s script instead of the <b>Wedding Master Tracker</b> sheet\'s script.', 'कोड वेबसाइट वाली स्क्रिप्ट में चला गया, <b>Wedding Master Tracker</b> वाली में नहीं।') + '</li></ol>' +
    '<button class="btn sm" data-act="recheck">↻ ' + K('Check again', 'फिर से देखें') + '</button></div>';
}
// everything the family changed is shown at once and saved in the background (one by one, kept safe if the internet drops)
var loading = null;
function load(silent, force, fresh) {
  if (Q.length) { pump(); return Promise.resolve(); }
  if (loading) return loading;
  loading = api('GET', 'action=all' + (fresh ? '&fresh=1' : '') + (force || !S.ver || !S.loaded || !S.v5 || !S.v6 ? '' : '&have=' + encodeURIComponent(S.ver))).then(function (d) {
    loading = null; S.offline = false; S.lastSync = Date.now();
    if (Q.length) return;
    if (!d.same) { applyData(d); saveCache(); }
    if (!S.sheet) render(); else renderStatus();
  }).catch(function (e) {
    loading = null;
    if (e.message === 'PIN') { S.loaded = false; render(); return; }
    if (e.message === 'NET') S.offline = true;
    if (!silent || !S.loaded) { S.error = e.message === 'NOURL' ? 'The planner is not connected yet. Paste your /exec link into CONFIG.scriptUrl in index.html.' : L('Could not reach the sheet. Check your internet and tap Refresh.', 'शीट तक नहीं पहुँच पाए। इंटरनेट देखें और ताज़ा करें दबाएँ।'); }
    if (!S.sheet) render(); else renderStatus();
  });
  return loading;
}
function loadRsvp(force) {
  if (!force && S.rsvp && Date.now() - S.rsvpAt < 120000) return;
  S.rsvpAt = Date.now();
  api('GET', 'action=rsvp').then(function (d) { S.rsvp = d.rsvp || []; S.rsvpNote = d.note || ''; LS.set('pl_rsvp', JSON.stringify(S.rsvp)); if (!S.sheet && S.tab === 'guests') render(); }).catch(function () {});
}

/* ---------- the save queue ---------- */
var Q = []; try { Q = JSON.parse(LS.get('pl_q') || '[]') || []; } catch (e) { Q = []; }
var pumping = false, retryT = 0;
function saveQ() { LS.set('pl_q', JSON.stringify(Q)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function enqueue(payload, tmp) { Q.push({ p: Object.assign({ cid: uid() }, payload), tmp: tmp || '' }); saveQ(); saveCache(); pump(); }
function swapId(tmp, real) {
  [S.tasks, S.vendors, S.payments, S.guests, S.shagun, S.flow, S.stays, S.alloc].forEach(function (arr) { arr.forEach(function (x) { if (x.id === tmp) x.id = real; if (x.vid === tmp) x.vid = real; }); });
  Q.forEach(function (it) { if (it.p.id === tmp) it.p.id = real; if (it.p.fields && it.p.fields.vid === tmp) it.p.fields.vid = real; });
  if (S.sheet) Object.keys(S.sheet).forEach(function (k) { if (S.sheet[k] === tmp) S.sheet[k] = real; });
}
function pump() {
  if (pumping || !Q.length) { renderStatus(); return; }
  pumping = true; renderStatus();
  var item = Q[0];
  api('POST', item.p).then(function (d) {
    pumping = false; S.offline = false;
    Q.shift(); if (item.tmp && d.id) swapId(item.tmp, d.id);
    saveQ(); saveCache();
    if (Q.length) pump(); else { renderStatus(); load(true); }
  }).catch(function (e) {
    pumping = false;
    if (e.message === 'NET') { S.offline = true; renderStatus(); clearTimeout(retryT); retryT = setTimeout(pump, 10000); return; }   // keep it; try again soon
    Q.shift(); saveQ();
    toast(e.message === 'PIN' ? L('Wrong PIN', 'पिन ग़लत है') : L('Not saved — ', 'सेव नहीं हुआ — ') + e.message, true);
    if (Q.length) pump(); else load(false, true);
  });
}
window.addEventListener('online', function () { S.offline = false; pump(); load(true); });

function renderStatus() {
  var p = document.getElementById('netPill'); if (!p) return;
  if (Q.length && (S.offline || !navigator.onLine)) { p.style.display = ''; p.className = 'netpill off'; p.textContent = '📴 ' + Q.length; p.title = L('Waiting for internet', 'इंटरनेट का इंतज़ार'); }
  else if (Q.length) { p.style.display = ''; p.className = 'netpill'; p.textContent = '⏳ ' + Q.length; p.title = L('Saving', 'सेव हो रहा है'); }
  else if (S.offline) { p.style.display = ''; p.className = 'netpill off'; p.textContent = '📴 ' + L('Offline', 'ऑफ़लाइन'); }
  else p.style.display = 'none';
  var s = document.getElementById('syncLine'); if (s) s.innerHTML = syncText();
}
function syncText() { return (Q.length ? L('Saving…', 'सेव हो रहा है…') : L('Updated ', 'अपडेट ') + (S.lastSync ? new Date(S.lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '')) + ' · <a href="#" data-act="refresh" style="color:inherit">' + K('Refresh', 'ताज़ा करें') + '</a>'; }
function toast(msg, err, undoId) { S.toast = { msg: msg, err: err, undo: undoId }; renderToast(); clearTimeout(toast.t); toast.t = setTimeout(function () { S.toast = null; renderToast(); }, undoId ? 7000 : err ? 4500 : 1800); }
function renderToast() {
  var el = document.getElementById('toast'); if (el) el.remove();
  if (S.toast) { var d = document.createElement('div'); d.id = 'toast'; d.className = 'toast' + (S.toast.err ? ' err' : ''); d.innerHTML = esc(S.toast.msg) + (S.toast.undo ? '<button data-act="undo" data-id="' + esc(S.toast.undo) + '">' + L('Undo · वापस', 'वापस') + '</button>' : ''); document.body.appendChild(d); }
}

/* ---------- saving: tasks, vendors, payments, guests, shagun, schedule ---------- */
function find(id) { return S.tasks.filter(function (x) { return x.id === id; })[0]; }
function saveFields(id, fields, okMsg, undoId) {
  var t = find(id); if (!t) return;
  Object.keys(fields).forEach(function (k) { t[k] = fields[k]; });
  if (fields.status === 'Completed') t.completedOn = today(); else if (fields.status) t.completedOn = '';
  t.updatedBy = S.me; t.updatedAt = today() + ' 00:00';
  enqueue({ action: 'update', id: id, fields: fields });
  if (okMsg) toast(okMsg, false, undoId);
  render();
}
function mact(payload, apply, ok, tmp) { apply(); enqueue(payload, tmp); if (ok) toast(ok); render(); }
function tableArr(t) { return t === 'guests' ? S.guests : t === 'shagun' ? S.shagun : t === 'stays' ? S.stays : t === 'alloc' ? S.alloc : S.flow; }
function rowSave(table, id, fields, ok) {
  var arr = tableArr(table);
  if (id) { var x = arr.filter(function (r) { return r.id === id; })[0]; if (x) Object.assign(x, fields, { by: S.me }); enqueue({ action: 'rowUpdate', table: table, id: id, fields: fields }); }
  else { var tmp = 'tmp' + uid(); arr.push(Object.assign({ id: tmp, by: S.me, at: today() }, fields)); enqueue({ action: 'rowAdd', table: table, fields: fields }, tmp); }
  if (ok) toast(ok); render();
}
function rowDel(table, id, ok) {
  var arr = tableArr(table), i = arr.findIndex(function (r) { return r.id === id; }); if (i >= 0) arr.splice(i, 1);
  enqueue({ action: 'rowDelete', table: table, id: id }); if (ok) toast(ok); render();
}

/* ---------- helpers ---------- */
var PR = { P0: 0, P1: 1, P2: 2 };
function sortTasks(a, b) { var da = a.due || '9999', db = b.due || '9999'; return da < db ? -1 : da > db ? 1 : (PR[a.priority] || 1) - (PR[b.priority] || 1) || (a.task < b.task ? -1 : 1); }
function open(t) { return t.status !== 'Completed'; }
function cats() { var s = {}; S.tasks.forEach(function (t) { s[t.category || 'Other'] = 1; }); return Object.keys(s).sort(); }
function owners() { var s = {}; S.tasks.forEach(function (t) { if (t.owner) s[t.owner] = 1; }); return Object.keys(s).sort(); }
function ownerOptions() { return owners().concat(CONFIG.people).filter(function (v, i, a) { return a.indexOf(v) === i; }); }
function doneDay(t) { return (t.status === 'Completed' ? (t.completedOn || t.updatedAt || '') : (t.updatedAt || '')).slice(0, 10); }
function fnHi(n) { var f = FUNCTIONS.filter(function (x) { return x.n === n; })[0]; return f ? f.hi : n; }
function waLink(phone, text) { var d = digits(mainPhone(phone)); if (/^00/.test(d)) d = d.slice(2); if (d.length === 11 && d.charAt(0) === '0') d = d.slice(1); if (d.length === 10) d = '91' + d; return 'https://wa.me/' + (d.length >= 11 ? d : '') + '?text=' + encodeURIComponent(text); }
function telLink(phone) { var d = String(mainPhone(phone) || '').replace(/[^\d+]/g, ''); return d.length >= 8 ? 'tel:' + d : ''; }
function callBtns(phone, waText) {
  var t = telLink(phone); if (!t) return '';
  return '<a class="call" href="' + esc(t) + '" data-stop="1">📞 ' + K('Call', 'कॉल') + '</a><a class="call wa" href="' + esc(waLink(phone, waText || '')) + '" target="_blank" rel="noopener" data-stop="1">💬 WhatsApp</a>';
}

function dueChip(t) {
  if (!t.due) return '';
  var d = diff(t.due), c = 'pill due';
  if (open(t) && d < 0) c += ' over'; else if (open(t) && d <= 3) c += ' soon';
  var lbl = d === 0 ? L('Today', 'आज') : d === 1 ? L('Tomorrow', 'कल') : d < 0 ? Math.abs(d) + L(' days late', ' दिन देर') : niceDate(t.due);
  return '<span class="' + c + '">' + (open(t) && d < 0 ? '⚠ ' : '📅 ') + lbl + '</span>';
}
function prioPill(t) { var p = (t.priority || 'P1'); return '<span class="pill p' + p.slice(1) + '">' + (PRIO[p] ? L(PRIO[p].en, PRIO[p].hi) : p) + '</span>'; }
function taskRow(t, showCat, started) {
  var isDone = t.status === 'Completed';
  return '<div class="task ' + (isDone ? 'done-t' : '') + '" data-act="edit" data-id="' + esc(t.id) + '">' +
    '<div class="t">' + esc(t.task) + '</div>' +
    '<div class="meta">' + prioPill(t) + dueChip(t) +
    (t.status === 'In Progress' ? '<span class="pill" style="background:#fff3da;color:#8a5a00">' + L('In progress', 'चल रहा है') + '</span>' : '') +
    (t.owner ? '<span>👤 ' + esc(t.owner) + '</span>' : '') + (showCat === 'fn' ? '<span>' + esc(L(t.fn || 'Before the wedding', fnHi(t.fn || 'Before the wedding'))) + '</span>' : showCat ? '<span>' + esc(t.category) + '</span>' : '') + '</div>' +
    (t.remarks ? '<div class="rem">' + esc(t.remarks) + '</div>' : '') +
    (isDone ? '<div style="margin-top:.5rem"><span class="doneTag">✓ ' + K('Done', 'पूरा हुआ') + (t.completedOn ? ' · ' + niceDate(t.completedOn) : '') + '</span></div>'
      : '<div><button class="doneBtn" data-act="askdone" data-id="' + esc(t.id) + '">✓ ' + K('Done', 'पूरा हुआ') + '</button>' +

/* ---------- TASKS: list / checklist / last 7 days ---------- */
function filtered() {
  return S.tasks.filter(function (t) {
    if (S.fStatus === 'open' && !open(t)) return false;
    if (S.fStatus === 'Completed' && open(t)) return false;
    if (S.fStatus === 'In Progress' && t.status !== 'In Progress') return false;
    if (S.fPrio !== 'all' && t.priority !== S.fPrio) return false;

    if (S.fOwner === '__none' ? !!t.owner : (S.fOwner !== 'all' && t.owner !== S.fOwner)) return false;
    if (S.fDate === 'none' && t.due) return false;

  });
}

function calcSplit() {
  var r = { A: 0, B: 0, fam: 0, fairS: 0, shared: [], personal: [], pendingShared: 0, persS: 0, persV: 0, persF: 0, setS: 0, setV: 0 };
  S.vendors.forEach(function (v) {
    var ps = paidSplit(v.id);
    if (v.split === 'Personal') { r.personal.push(v); r.persS += ps.Shrijeet; r.persV += ps.Shivangi; r.persF += ps.Family; return; }
    r.shared.push(v); r.A += ps.Shrijeet; r.B += ps.Shivangi; r.fam += ps.Family; r.fairS += (ps.Shrijeet + ps.Shivangi) * v.pct / 100;
    r.pendingShared += Math.max(0, v.quoted - ps.total);
  });
  S.payments.forEach(function (p) { if (p.vid === 'SETTLE') { if (p.by === 'Shivangi') r.setV += num(p.amount); else if (p.by === 'Shrijeet') r.setS += num(p.amount); } });
  r.T = r.A + r.B; r.fairV = r.T - r.fairS;
  r.net = r.A - r.fairS - r.setV + r.setS;      // >0 : Shivangi owes Shrijeet
  return r;
}
function owesLine(c) {
  var n = Math.round(c.net);

}

function flowMin(f) { if (!f.start) return 9999; var p = f.start.split(':'), m = +p[0] * 60 + (+p[1] || 0); return m < 300 ? m + 1440 : m; }   // after-midnight rituals (e.g. 2:30 AM) stay with the night before

function flowState(f) {

}

      S.sheet = { confirm: 1 }; confirmBox(B('Delete this place?', 'यह जगह हटानी है?'), ds2 ? ds2.name : '', used ? L(used + ' family stays are planned here — they will show under “No place yet”.', 'यहाँ ' + used + ' परिवार तय हैं — वे “अभी जगह तय नहीं” में दिखेंगे।') : '', 'confirmdelst', id); return;
    case 'confirmdelst': closeSheet(true); S.sheet = null; rowDel('stays', id, L('Deleted', 'हटा दिया')); return;
    /* schedule */
    case 'addflow': openFlow(''); return;
    case 'editflow': openFlow(id); return;
    case 'saveflow':
      var ff = { what: val('f_what'), fn: document.getElementById('f_fn').value, date: document.getElementById('f_date').value, start: document.getElementById('f_start').value, end: document.getElementById('f_end').value, people: val('f_people'), venue: val('f_venue'), coord: val('f_coord'), song: val('f_song'), photo: val('f_photo'), remarks: val('f_rem') };
      if (!ff.what) { toast(L('Please type what happens', 'कृपया लिखें क्या होगा'), true); return; }
      closeSheet(true); S.sheet = null; rowSave('flow', id, ff, L('Saved ✓', 'सेव हुआ ✓')); return;
    case 'delflow': var df = S.flow.filter(function (x) { return x.id === id; })[0]; S.sheet = { confirm: 1 }; confirmBox(B('Delete from the schedule?', 'क्या यह हटाना है?'), df ? df.what : '', '', 'confirmdelf', id); return;
    case 'confirmdelf': closeSheet(true); S.sheet = null; rowDel('flow', id, L('Deleted', 'हटा दिया')); return;
  }
});
var searchT = 0;
document.addEventListener('input', function (e) {
  if (e.target.id === 'gq') { S.gq = e.target.value; clearTimeout(searchT); searchT = setTimeout(function () { render(); window.scrollTo(0, 0); }, 120); }
  if (e.target.id === 'inv_msg' && S.sheet && S.sheet.send) LS.set('pl_im_' + sheetCode(), e.target.value);
  if (e.target.id === 'rm_en' || e.target.id === 'rm_hi') LS.set(e.target.id === 'rm_en' ? 'pl_rm_en' : 'pl_rm_hi', e.target.value);
  if (e.target.id === 'dm_en' || e.target.id === 'dm_hi') LS.set('pl_dm_' + e.target.getAttribute('data-d') + (e.target.id === 'dm_en' ? '_en' : '_hi'), e.target.value);
  if (e.target.id === 'inv_lq' && S.sheet && S.sheet.send) { S.sheet.lq = e.target.value; clearTimeout(searchT); searchT = setTimeout(function () { sendKeep(); openSend(); var i = document.getElementById('inv_lq'); if (i) { i.focus(); var n = i.value.length; try { i.setSelectionRange(n, n); } catch (er) {} } }, 200); }
  if (e.target.id === 'dq') { S.dq = e.target.value; clearTimeout(searchT); searchT = setTimeout(function () { var pos = e.target.selectionStart; render(); var i = document.getElementById('dq'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } }, 150); }
  if (e.target.id === 'sq') { S.sq = e.target.value; clearTimeout(searchT); searchT = setTimeout(function () { var pos = e.target.selectionStart; render(); var i = document.getElementById('sq'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } }, 150); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'fcat') { S.fCat = e.target.value; render(); }
  if (e.target.id === 'fown') { S.fOwner = e.target.value; render(); }
});
setInterval(function () { if (!document.hidden && S.loaded && !S.sheet && S.pin && S.me) load(true); }, 30000);
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.loaded && S.pin && S.me) { pump(); if (!S.sheet) load(true); } });

/* ---------- start: show the last saved plan at once, then check for changes ---------- */
(function () {
  if (!S.pin || !S.me) return;
  try {
    var c = JSON.parse(LS.get('pl_cache') || 'null');
    if (c && ((c.t && c.t.length) || c.role === 'shagun')) { S.role = c.role || 'family'; S.tasks = c.t || []; S.vendors = c.v || []; S.payments = c.p || []; S.guests = c.g || []; S.shagun = c.s || []; S.flow = c.f || []; S.stays = c.st || []; S.alloc = c.al || []; S.names = c.n || []; S.ver = c.ver || ''; S.v4 = c.v4; S.v5 = c.v5; S.v6 = c.v6; S.loaded = true; S.lastSync = c.at || 0; }
    var r = JSON.parse(LS.get('pl_rsvp') || 'null'); if (r) S.rsvp = r;
  } catch (e) {}
})();
render();
if (S.pin && S.me) { if (Q.length) pump(); else load(true); }
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
</script>
</body>
