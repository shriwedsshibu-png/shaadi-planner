<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#430c19" />
<meta name="robots" content="noindex, nofollow" />
<title>Shaadi Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@600;700&family=Lora:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet" />
<style>
.hi{font-family:'Noto Sans Devanagari','Lora',sans-serif;font-weight:700}

:root{--maroon:#6a1526;--maroon-d:#430c19;--gold:#b98a2e;--gold-s:#e7cf98;--ivory:#fbf6ee;--cream:#f3e8d6;--ink:#2e1a1c;--muted:#6b5a52;--ok:#2f7a3e;--warn:#c47a00;--bad:#b3261e;--nav:4.4rem;--hh:3.5rem}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:'Lora',Georgia,serif;line-height:1.45;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 1rem);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
header.top{height:var(--hh);position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#5b1223,var(--maroon-d));color:#ffe2a3;border-bottom:2px solid var(--gold);padding:0 1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
header.top h1{margin:0;font-family:'Cinzel',serif;font-size:1.05rem;letter-spacing:.06em;font-weight:600}
.who{background:rgba(255,226,163,.15);border:1px solid rgba(255,226,163,.5);color:#ffe2a3;border-radius:999px;padding:.35rem .8rem;font-size:.85rem;cursor:pointer;max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:46rem;margin:0 auto;padding:1rem 1rem 5.5rem}
.hero{background:radial-gradient(circle at 50% 0%,#8a2638,#5b1424 60%,#40101c);color:#fff7e6;border-radius:1.2rem;padding:1.2rem;border:1.5px solid var(--gold);box-shadow:0 8px 24px rgba(74,17,32,.25)}
.hero .big{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:3.2rem;line-height:1;color:#ffe2a3}
.hero .sub{opacity:.9;font-size:.95rem}
.bar{height:.7rem;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin:.8rem 0 .3rem}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e0bb6a,#f5dc9c);border-radius:99px;transition:width .4s}
.stats{display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap}
.stat{background:rgba(0,0,0,.2);border:1px solid rgba(231,207,152,.4);border-radius:.8rem;padding:.4rem .7rem;font-size:.85rem}
.stat b{font-size:1.1rem;color:#ffe2a3}
h2.sec{font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;color:var(--maroon);margin:1.5rem 0 .6rem;display:flex;align-items:center;gap:.5rem}
h2.sec .n{background:var(--maroon);color:#fff7e6;border-radius:99px;font-size:.75rem;padding:.05rem .55rem;letter-spacing:0}
h2.sec.bad{color:var(--bad)} h2.sec.bad .n{background:var(--bad)}
.card{background:#fffdf9;border:1px solid rgba(184,137,59,.4);border-radius:1rem;box-shadow:0 4px 14px rgba(74,17,32,.06)}
.task{display:flex;gap:.8rem;align-items:flex-start;padding:.8rem .8rem;border-bottom:1px solid rgba(184,137,59,.2);cursor:pointer}
.task:last-child{border-bottom:0}
.chk{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;border:2px solid var(--gold);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;color:#fff;font-size:1.1rem;margin-top:.1rem}
.chk.prog{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,#fff 50%)}
.chk.done{background:var(--ok);border-color:var(--ok)}
.tt{flex:1;min-width:0}
.tt .t{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.done-t .t{text-decoration:line-through;opacity:.55}
.meta{display:flex;flex-wrap:wrap;gap:.3rem .5rem;margin-top:.25rem;font-size:.8rem;color:var(--muted)}
.pill{border-radius:99px;padding:.05rem .55rem;font-weight:700;font-size:.72rem;border:1px solid transparent;font-family:'Cinzel',serif}
.p0{background:#fde8e6;color:var(--bad);border-color:#f2b8b3}.p1{background:#fff3da;color:#8a5a00;border-color:#f0d391}.p2{background:#eef3ea;color:#4a6a3a;border-color:#cfe0c3}
.due{background:var(--cream);color:#55403a}.due.over{background:#fde8e6;color:var(--bad)}.due.soon{background:#fff3da;color:#8a5a00}
.rem{font-size:.85rem;color:var(--muted);margin-top:.2rem}
.empty{padding:1.2rem;text-align:center;color:var(--muted)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:linear-gradient(180deg,#5c1727,var(--maroon-d));border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;height:var(--nav);border:0;background:transparent;color:#e9d9bd;font-family:'Cinzel',serif;font-weight:600;font-size:.78rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;cursor:pointer}
nav.bottom button svg{width:1.6rem;height:1.6rem}
nav.bottom button.on{color:#ffd98a;box-shadow:inset 0 3px 0 #ffd98a}
.fab{position:fixed;right:1rem;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + .9rem);z-index:41;width:3.6rem;height:3.6rem;border-radius:50%;border:2px solid #f1d99a;background:linear-gradient(180deg,#e0bb6a,#b8893b);color:#3b1a1a;font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 8px 20px rgba(74,17,32,.4)}
.btn{border:1.5px solid var(--gold);background:linear-gradient(180deg,#7d2231,var(--maroon-d));color:#fff7e6;border-radius:99px;padding:.75rem 1.4rem;font-weight:700;font-size:1rem;cursor:pointer;min-height:3rem}
.btn.ghost{background:transparent;color:var(--maroon);border-color:var(--maroon)}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.input,select.input,textarea.input{width:100%;min-height:3rem;border:1.5px solid #dccbb0;border-radius:.8rem;padding:.65rem .85rem;background:#fff}
textarea.input{min-height:5rem;resize:vertical}
.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,137,59,.25)}
label.l{display:block;font-weight:700;font-size:.85rem;margin:.9rem 0 .3rem;font-family:'Cinzel',serif;letter-spacing:.04em}
.seg{display:flex;gap:.35rem;flex-wrap:wrap}
.seg button{flex:1;min-width:5rem;border:1.5px solid #dccbb0;background:#fff;border-radius:.8rem;padding:.65rem .4rem;font-weight:700;cursor:pointer;font-size:.92rem}
.seg button.on{background:var(--maroon);color:#fff7e6;border-color:var(--maroon)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.2rem 0 .6rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid #dccbb0;background:#fff;border-radius:99px;padding:.4rem .9rem;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--maroon);color:#fff7e6;border-color:var(--maroon)}
.catHead{display:flex;justify-content:space-between;align-items:center;padding:.7rem .9rem;background:var(--cream);border-radius:1rem 1rem 0 0;font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;color:var(--maroon);letter-spacing:.05em}
.catHead small{font-family:'Lora',serif;font-weight:600;color:var(--muted)}
.group{margin-bottom:1rem;overflow:hidden}
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(46,26,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ivory);width:100%;max-width:46rem;max-height:92vh;overflow-y:auto;border-radius:1.4rem 1.4rem 0 0;padding:1.1rem 1.1rem calc(1.3rem + env(safe-area-inset-bottom));border-top:3px solid var(--gold)}
.sheet h3{margin:0 0 .2rem;font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--maroon)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 5rem);background:#2e1a1c;color:#fff;border-radius:99px;padding:.6rem 1.1rem;z-index:80;font-size:.9rem;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.err{background:var(--bad)}
.gate{max-width:24rem;margin:12vh auto 0;padding:1.4rem;text-align:center}
.gate h2{font-family:'Cormorant Garamond',serif;font-size:2.2rem;color:var(--maroon);margin:.2rem 0}
.sync{font-size:.75rem;opacity:.8;text-align:center;margin-top:1.2rem;color:var(--muted)}
.vend{padding:.9rem 1rem;margin-bottom:.8rem}
.vend h4{margin:0;font-size:1.05rem}.vend .cat{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.6rem;text-align:center}
.money div{background:var(--cream);border-radius:.7rem;padding:.4rem .2rem;font-size:.75rem;color:var(--muted)}.money b{display:block;font-size:.98rem;color:var(--ink)}
.money .bal b{color:var(--bad)}.money .bal.zero b{color:var(--ok)}
a.call{display:inline-block;margin-top:.5rem;color:var(--maroon);font-weight:700;text-decoration:none;border:1.5px solid var(--maroon);border-radius:99px;padding:.3rem .9rem;font-size:.9rem}
.big-check .task{padding:1.05rem .9rem}.big-check .t{font-size:1.15rem}.big-check .chk{width:2.5rem;height:2.5rem}

.doneBtn{margin-top:.55rem;border:2px solid var(--ok);background:#fff;color:var(--ok);border-radius:.9rem;padding:.6rem 1rem;font-weight:700;cursor:pointer;min-height:3rem;display:inline-flex;align-items:center;gap:.5rem}
.doneBtn:active{background:var(--ok);color:#fff}
.doneTag{display:inline-flex;align-items:center;gap:.35rem;background:#e7f4e8;color:var(--ok);border-radius:99px;padding:.15rem .7rem;font-weight:700;font-size:.8rem}
.addbig{width:100%;margin-top:1rem;background:linear-gradient(180deg,#e0bb6a,#b8893b);color:#3b1a1a;border:1.5px solid #f1d99a;border-radius:1rem;padding:.9rem;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 16px rgba(143,106,38,.3)}
.fab{width:auto!important;height:auto!important;border-radius:99px!important;padding:.75rem 1.2rem;font-size:1rem!important;font-weight:700;display:flex;align-items:center;gap:.5rem}
.sub2{display:block;font-size:.72em;opacity:.85;font-weight:600}
nav.bottom button{font-size:.72rem;line-height:1.1}
.grp{margin-bottom:1.3rem;overflow:hidden}
.last-h{padding:.55rem .9rem;background:#fff3da;color:#8a5a00;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
.modal{background:var(--ivory);width:min(92vw,26rem);border-radius:1.2rem;padding:1.3rem;border-top:4px solid var(--ok);margin:auto 0}
.sheetbg.center{align-items:center}
.toast button{margin-left:.8rem;background:#ffe2a3;color:#3b1a1a;border:0;border-radius:99px;padding:.3rem .8rem;font-weight:700;cursor:pointer}
.more{margin-top:.8rem}
header.top h1{white-space:nowrap}
.sbar{position:sticky;top:var(--hh);z-index:29;background:var(--ivory);padding:.6rem 1rem;border-bottom:1px solid rgba(184,137,59,.35);box-shadow:0 4px 10px rgba(74,17,32,.06)}
.sbar .in{max-width:46rem;margin:0 auto;position:relative}
#gq{padding-left:2.7rem;padding-right:3rem;border-radius:99px;min-height:3.1rem;border-color:var(--gold)}
.sbar .si{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1.1rem;pointer-events:none}
.sbar .sx{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:var(--cream);color:var(--maroon);font-size:1.1rem;cursor:pointer;display:none}
.progBtn{margin-top:.55rem;margin-left:.5rem;border:2px solid var(--warn);background:#fff;color:#8a5a00;border-radius:.9rem;padding:.6rem 1rem;font-weight:700;cursor:pointer;min-height:3rem}
.res-note{font-size:.9rem;color:var(--muted);margin:.3rem .2rem .6rem}
@media(max-width:380px){header.top{padding:0 .7rem}header.top h1{font-size:.8rem;letter-spacing:.03em}.who{padding:.3rem .65rem;max-width:7.5rem;font-size:.8rem}.money b{font-size:.8rem}.money{gap:.25rem}.hero{padding:1rem}}

.seeall{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid #eadcc0;padding:.8rem 1rem;color:var(--maroon);font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
.vbtns{display:flex;gap:.5rem;align-items:center;margin-top:.7rem;flex-wrap:wrap}.vbtns .btn{min-height:2.8rem;padding:.4rem 1.1rem;font-size:.98rem}
.delbtn{display:block;width:100%;margin-top:1rem;background:none;border:2px solid #c0392b;color:#c0392b;border-radius:.9rem;padding:.8rem;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;min-height:3rem}
.seg2{display:flex;gap:.4rem;margin-top:.5rem}.seg2 button{flex:1;border:2px solid #d9c79c;background:#fff;color:var(--maroon);border-radius:.8rem;padding:.55rem;font-weight:700;cursor:pointer;min-height:2.8rem;font-family:inherit;font-size:.95rem}.seg2 button.on{background:var(--maroon);color:#fff7e6;border-color:var(--maroon)}
</style>

<body>
<header class="top" id="hdr" style="display:none"><h1>🪔 SHAADI PLANNER</h1><button class="who" id="whoBtn" data-act="switch" title="Change name"></button></header>
<div class="sbar" id="sbar" style="display:none"><div class="in"><span class="si">🔍</span><input class="input" id="gq" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search task, vendor, event or date…" /><button class="sx" id="gqx" data-act="clearsearch" aria-label="Clear search">✕</button></div></div>
<div id="app"></div>
<script>
/* ============ SETTINGS (the only part you may edit) ============ */
var CONFIG = {
  scriptUrl: "https://script.google.com/macros/s/AKfycbzZyiDscv0WK7REJA9YLGLPqwlBNG036OVvb7C0YJAux4N5C_sXdYd3_pnuRdQ4cA/exec",                 // paste your Web app link (ends with /exec) between the quotes
  weddingDate: "2026-12-02",     // the big day, used for the countdown
  weddingTitle: "Shrijeet & Shivangi",
  people: ["Shrijeet", "Shivangi", "Mummy", "Papa"]   // quick-pick names on the "Who are you?" screen
};
/* ================================================================ */

var FUNCTIONS = [
  { n: 'Before the wedding', hi: 'शादी से पहले', d: '' },
  { n: 'Faldaan', hi: 'फलदान', d: '30 Nov' },
  { n: 'Mehndi', hi: 'मेहंदी', d: '1 Dec, morning' },
  { n: 'Engagement & Sangeet', hi: 'सगाई और संगीत', d: '1 Dec, evening' },
  { n: 'Haldi', hi: 'हल्दी', d: '2 Dec, morning' },
  { n: 'Varmala & Shaadi', hi: 'वरमाला और शादी', d: '2 Dec night, 7:30 PM onwards' },
  { n: 'After the wedding', hi: 'शादी के बाद', d: '' }
];
var PRIO = { P0: { en: 'Critical', hi: 'बहुत ज़रूरी' }, P1: { en: 'Important', hi: 'ज़रूरी' }, P2: { en: 'Normal', hi: 'सामान्य' } };
var STATUS = [{ v: 'Pending', en: 'Not started', hi: 'बाकी' }, { v: 'In Progress', en: 'In progress', hi: 'चल रहा है' }, { v: 'Completed', en: 'Done', hi: 'पूरा हुआ' }];

var $app = document.getElementById('app');
var LS = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
var S = { gq: '', tasks: [], vendors: [], payments: [], vtab: 'list', back: '', tab: 'today', loaded: false, error: '', pin: LS.get('pl_pin'), me: LS.get('pl_me'), q: '', fStatus: 'open', fPrio: 'all', fCat: 'all', fOwner: 'all', fDate: 'all', sheet: null, toast: null, pending: 0, lastSync: 0, needPin: false };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return ymd(new Date()); }
function dayNum(s) { var p = String(s).slice(0, 10).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
function diff(s) { return dayNum(s) - dayNum(today()); }
function money(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function niceDate(s) { var p = String(s).slice(0, 10).split('-'); var m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']; return +p[2] + ' ' + m[+p[1] - 1]; }
function B(en, hi) { return esc(en) + ' <span class="hi">· ' + esc(hi) + '</span>'; }       // inline English · Hindi
function B2(en, hi) { return '<span>' + esc(en) + '</span><span class="sub2 hi">' + esc(hi) + '</span>'; }  // stacked

/* ---------- network ---------- */
function api(method, payload) {
  if (!CONFIG.scriptUrl) return Promise.reject(new Error('NOURL'));
  var req = method === 'GET'
    ? fetch(CONFIG.scriptUrl + '?action=all&pin=' + encodeURIComponent(S.pin) + '&t=' + Date.now())
    : fetch(CONFIG.scriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pin: S.pin, by: S.me }, payload)) });
  return req.then(function (r) { return r.text(); }).then(function (t) {
    var d; try { d = JSON.parse(t); } catch (e) { throw new Error('BAD'); }
    if (d.code === 'PIN') { S.needPin = true; throw new Error('PIN'); }
    if (!d.success) throw new Error(d.message || 'Failed');
    return d;
  });
}
function saveCache() { try { LS.set('pl_cache', JSON.stringify({ t: S.tasks, v: S.vendors, p: S.payments, at: Date.now() })); } catch (e) {} }
function load(silent) {
  if (S.pending > 0) return Promise.resolve();
  return api('GET').then(function (d) {
    if (S.pending > 0) return;
    S.tasks = d.tasks; S.vendors = d.vendors; S.payments = d.payments || []; S.loaded = true; S.error = ''; S.lastSync = Date.now(); S.needPin = false; saveCache();
    if (!S.sheet) render();
  }).catch(function (e) {
    if (e.message === 'PIN') { S.loaded = false; render(); return; }
    if (!silent || !S.loaded) { S.error = e.message === 'NOURL' ? 'The planner is not connected yet. Paste your /exec link into CONFIG.scriptUrl in index.html.' : 'Could not reach the sheet. Check your internet and tap Refresh.'; render(); }
  });
}
function toast(msg, err, undoId) { S.toast = { msg: msg, err: err, undo: undoId }; renderToast(); clearTimeout(toast.t); toast.t = setTimeout(function () { S.toast = null; renderToast(); }, undoId ? 7000 : err ? 4500 : 1800); }
function renderToast() {
  var el = document.getElementById('toast'); if (el) el.remove();
  if (S.toast) { var d = document.createElement('div'); d.id = 'toast'; d.className = 'toast' + (S.toast.err ? ' err' : ''); d.innerHTML = esc(S.toast.msg) + (S.toast.undo ? '<button data-act="undo" data-id="' + esc(S.toast.undo) + '">Undo · वापस</button>' : ''); document.body.appendChild(d); }
}
function find(id) { return S.tasks.filter(function (x) { return x.id === id; })[0]; }
function saveFields(id, fields, okMsg, undoId) {
  var t = find(id); if (!t) return;
  var before = {}; Object.keys(fields).forEach(function (k) { before[k] = t[k]; t[k] = fields[k]; });
  if (fields.status === 'Completed') t.completedOn = today(); else if (fields.status) t.completedOn = '';
  t.updatedBy = S.me; t.updatedAt = today() + ' 00:00';
  S.pending++; render();
  api('POST', { action: 'update', id: id, fields: fields }).then(function () { S.pending--; saveCache(); if (okMsg) toast(okMsg, false, undoId); render(); })
    .catch(function (e) { S.pending--; Object.keys(before).forEach(function (k) { t[k] = before[k]; }); render(); toast(e.message === 'PIN' ? 'Wrong PIN' : 'Not saved — ' + (e.message === 'BAD' ? 'please try again' : e.message), true); });
}

/* ---------- helpers ---------- */
var PR = { P0: 0, P1: 1, P2: 2 };
function sortTasks(a, b) { var da = a.due || '9999', db = b.due || '9999'; return da < db ? -1 : da > db ? 1 : (PR[a.priority] || 1) - (PR[b.priority] || 1) || (a.task < b.task ? -1 : 1); }
function open(t) { return t.status !== 'Completed'; }
function cats() { var s = {}; S.tasks.forEach(function (t) { s[t.category || 'Other'] = 1; }); return Object.keys(s).sort(); }
function owners() { var s = {}; S.tasks.forEach(function (t) { if (t.owner) s[t.owner] = 1; }); return Object.keys(s).sort(); }
function ownerOptions() { return owners().concat(CONFIG.people).filter(function (v, i, a) { return a.indexOf(v) === i; }); }
function doneDay(t) { return (t.status === 'Completed' ? (t.completedOn || t.updatedAt || '') : (t.updatedAt || '')).slice(0, 10); }

function dueChip(t) {
  if (!t.due) return '';
  var d = diff(t.due), c = 'pill due';
  if (open(t) && d < 0) c += ' over'; else if (open(t) && d <= 3) c += ' soon';

function calcSplit() {

}
function vendorHay(v) { return (v.category + ' ' + v.vendor + ' ' + v.contact + ' ' + v.deliverables + ' ' + v.paidBy + ' ' + v.remarks + ' ' + v.status).toLowerCase(); }

function viewSearch() {
  var words = S.gq.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var res = S.tasks.filter(function (t) { return matchAll(taskHay(t), words); });
  var first = words[0];
  res.sort(function (a, b) {
    var oa = open(a) ? 0 : 1, ob = open(b) ? 0 : 1; if (oa !== ob) return oa - ob;
    var ta = a.task.toLowerCase().indexOf(first) >= 0 ? 0 : 1, tb = b.task.toLowerCase().indexOf(first) >= 0 ? 0 : 1; if (ta !== tb) return ta - tb;
    return sortTasks(a, b);
  });
  var vend = S.vendors.filter(function (v) { return matchAll(vendorHay(v), words); });
  var h = '<div class="res-note">' + res.length + ' task' + (res.length === 1 ? '' : 's') + (vend.length ? ' · ' + vend.length + ' vendor' + (vend.length === 1 ? '' : 's') : '') + ' found for “' + esc(S.gq.trim()) + '” <span class="hi">· मिले</span></div>';
  if (!res.length && !vend.length) h += '<div class="card empty">Nothing found. Try one word, like <b>mehndi</b>, <b>tickets</b> or a name.<br><br><button class="btn" data-act="addfromsearch">＋ ' + B('Add “' + S.gq.trim() + '” as a new task', 'नया काम बनाएँ') + '</button></div>';
  if (res.length) h += '<div class="card">' + res.slice(0, 60).map(searchRow).join('') + '</div>' + (res.length > 60 ? '<div class="res-note">Showing the first 60. Type more letters to narrow down.</div>' : '');
  if (vend.length) h += '<h2 class="sec">' + B('Vendors', 'विक्रेता') + ' <span class="n">' + vend.length + '</span></h2>' + vend.slice(0, 12).map(vendorMini).join('');
  return h;
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var seg = e.target.closest('.seg button'); if (seg) { seg.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); }); seg.classList.add('on'); return; }
  if (e.target.id === 'sheetbg') { closeSheet(); return; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
  if (act === 'askdone') { e.stopPropagation(); askDone(id); return; }
  if (act === 'confirmdone') { closeSheet(); saveFields(id, { status: 'Completed' }, 'Marked as done ✓', id); return; }
  if (act === 'undo') { S.toast = null; renderToast(); saveFields(id, { status: 'Pending' }, 'Moved back to Not started'); return; }
  if (act === 'edit') { if (String(id).indexOf('tmp') === 0) { toast('Still saving this task…'); return; } openEditor(id); return; }
  if (act === 'tab') { S.tab = v; S.gq = ''; document.getElementById('gq').value = ''; render(); window.scrollTo(0, 0); return; }
  if (act === 'clearsearch') { S.gq = ''; var gi = document.getElementById('gq'); gi.value = ''; gi.focus(); render(); return; }
  if (act === 'started') { e.stopPropagation(); saveFields(id, { status: 'In Progress' }, 'Marked as started ▶', id); return; }
  if (act === 'addfromsearch') { var txt = S.gq.trim(); openAdd(); var ai = document.getElementById('a_task'); if (ai) ai.value = txt; return; }
  if (act === 'vt') { S.vtab = v; render(); window.scrollTo(0, 0); return; }
  if (act === 'gocat') { S.tab = 'tasks'; S.fCat = v; S.fStatus = 'open'; S.fPrio = 'all'; S.gq = ''; document.getElementById('gq').value = ''; render(); window.scrollTo(0, 0); return; }
  if (act === 'addvendor') { openVendor(''); return; }
  if (act === 'editvendor') { if (String(id).indexOf('tmp') === 0) { toast('Still saving…'); return; } openVendor(id); return; }
  if (act === 'savevendor') {
    var vf = { category: document.getElementById('v_cat').value.trim(), vendor: document.getElementById('v_name').value.trim(), quoted: numv('v_q'), split: segVal('v_split') || 'Shared', pct: Math.min(100, Math.max(0, numv('v_pct'))), contact: document.getElementById('v_con').value.trim(), deliverables: document.getElementById('v_del').value.trim(), remarks: document.getElementById('v_rem').value.trim() };
    if (!vf.category && !vf.vendor) { toast('Please type the item or vendor name', true); return; }
    closeSheet();
    if (id) { var cur = findV(id); mact({ action: 'vendorUpdate', id: id, fields: vf }, function () { Object.keys(vf).forEach(function (k) { cur[k] = vf[k]; }); }, 'Saved ✓'); }
    else { var nv2 = Object.assign({ id: 'tmp' + Date.now(), advance: 0, balance: vf.quoted, status: '' }, vf); mact({ action: 'vendorAdd', fields: vf }, function () { S.vendors.push(nv2); }, 'Added ✓'); }
    return;
  }
  if (act === 'delvendor') {
    var dv = findV(id); S.sheet = { confirmDelV: id };
    showSheet('<div class="modal"><h3 style="margin:0;font-family:Cormorant Garamond,serif;font-size:1.5rem;color:var(--maroon)">' + B('Delete this vendor?', 'क्या यह हटाना है?') + '</h3><p style="font-size:1.1rem;font-weight:600;margin:.6rem 0">' + esc(dv ? (dv.vendor || dv.category) : '') + '</p><p class="rem">Its payments will be deleted too. This cannot be undone.</p><div style="display:flex;gap:.6rem;margin-top:1rem"><button class="btn ghost" data-act="closesheet" style="flex:1">' + B('No', 'नहीं') + '</button><button class="btn" style="flex:1.4;background:linear-gradient(180deg,#c0392b,#962d22)" data-act="confirmdelv" data-id="' + esc(id) + '">' + B('Yes, delete', 'हाँ, हटाएँ') + '</button></div></div>', true);
    return;
  }
  if (act === 'confirmdelv') { closeSheet(); mact({ action: 'vendorDelete', id: id }, function () { S.vendors = S.vendors.filter(function (x) { return x.id !== id; }); S.payments = S.payments.filter(function (x) { return x.vid !== id; }); }, 'Deleted'); return; }
  if (act === 'setsplit') { e.stopPropagation(); var sv = findV(id); if (!sv || sv.split === v) return; mact({ action: 'vendorUpdate', id: id, fields: { split: v } }, function () { sv.split = v; }, v === 'Personal' ? 'Marked personal — not divided' : 'Marked shared'); return; }
  if (act === 'addpay') { if (String(id).indexOf('tmp') === 0) { toast('Still saving…'); return; } var bk = el.getAttribute('data-back'); openPay(id, '', !!bk); return; }
  if (act === 'editpay') { var pp = S.payments.filter(function (x) { return x.id === id; })[0]; if (!pp || String(id).indexOf('tmp') === 0) { toast('Still saving…'); return; } openPay(pp.vid, id, S.sheet && S.sheet.vendor); return; }
  if (act === 'savepay') {
    var amt = numv('p_amt'); if (!amt) { toast('Please enter the amount', true); return; }
    var pf = { amount: amt, by: segVal('p_by') || 'Shrijeet', date: document.getElementById('p_date').value || today(), note: document.getElementById('p_note').value.trim() };
    var sh = S.sheet, vid = sh.pay, backId = sh.back; closeSheet();
    if (sh.payId) { var ex = S.payments.filter(function (x) { return x.id === sh.payId; })[0]; mact({ action: 'payUpdate', id: sh.payId, fields: pf }, function () { Object.keys(pf).forEach(function (k) { ex[k] = pf[k]; }); }, 'Saved ✓'); }
    else { mact({ action: 'payAdd', fields: Object.assign({ vid: vid }, pf) }, function () { S.payments.push(Object.assign({ id: 'tmp' + Date.now(), vid: vid, addedBy: S.me }, pf)); }, 'Payment added ✓'); }
    if (backId) setTimeout(function () { openVendor(backId); }, 0);
    return;
  }
  if (act === 'delpay') {
    var dp = S.payments.filter(function (x) { return x.id === id; })[0], backId2 = S.sheet && S.sheet.back; closeSheet();
    mact({ action: 'payDelete', id: id }, function () { S.payments = S.payments.filter(function (x) { return x.id !== id; }); }, 'Deleted');
    if (backId2 && dp && dp.vid !== 'SETTLE') setTimeout(function () { openVendor(backId2); }, 0);
    return;
  }
  if (act === 'settle') { openSettle(''); return; }
  if (act === 'editsettle') { openSettle(id); return; }
  if (act === 'savesettle') {
    var sa = numv('s_amt'); if (!sa) { toast('Please enter the amount', true); return; }
    var sf = { amount: sa, by: segVal('s_by') || 'Shivangi', date: document.getElementById('s_date').value || today(), note: document.getElementById('s_note').value.trim() }, sid2 = S.sheet.settle; closeSheet();
    if (sid2 && sid2 !== 'new') { var se = S.payments.filter(function (x) { return x.id === sid2; })[0]; mact({ action: 'payUpdate', id: sid2, fields: sf }, function () { Object.keys(sf).forEach(function (k) { se[k] = sf[k]; }); }, 'Saved ✓'); }
    else mact({ action: 'payAdd', fields: Object.assign({ vid: 'SETTLE' }, sf) }, function () { S.payments.push(Object.assign({ id: 'tmp' + Date.now(), vid: 'SETTLE', addedBy: S.me }, sf)); }, 'Settlement noted ✓');
    return;
  }
  if (act === 'copysum') { var tx = summaryText(); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tx).then(function () { toast('Summary copied — paste it in WhatsApp'); }, function () { toast('Could not copy', true); }); else toast('Could not copy', true); return; }
  if (act === 'fs') { S.fStatus = v; render(); return; }
  if (act === 'fp') { S.fPrio = v; render(); return; }
  if (act === 'fd') { S.fDate = S.fDate === 'none' ? 'all' : 'none'; render(); return; }
  if (act === 'gonodate') { S.tab = 'tasks'; S.fDate = 'none'; S.fStatus = 'open'; render(); window.scrollTo(0, 0); return; }
  if (act === 'gorecent') { S.tab = 'tasks'; S.fStatus = 'recent'; S.gq = ''; document.getElementById('gq').value = ''; render(); window.scrollTo(0, 0); return; }
  if (act === 'refresh') { e.preventDefault(); toast('Refreshing…'); load(); return; }
  if (act === 'add') { openAdd(); return; }
  if (act === 'more') { var m = document.getElementById('a_more'); if (m) { m.style.display = 'block'; el.remove(); } return; }
  if (act === 'closesheet') { closeSheet(); return; }
  if (act === 'pickme') { var mm = document.getElementById('gme'); if (mm) mm.value = v; return; }
  if (act === 'switch') { S.me = ''; render(); return; }
  if (act === 'enter') {
    var pe = document.getElementById('gpin'), me = document.getElementById('gme').value.trim();
    if (pe) S.pin = pe.value.trim();
    if (!S.pin) { toast('Please enter the PIN', true); return; }
    if (!me) { toast('Please enter your name', true); return; }
    S.me = me; LS.set('pl_pin', S.pin); LS.set('pl_me', S.me); S.needPin = false; S.loaded = false; S.error = ''; render(); load(); return;
  }
  if (act === 'saveedit') {
    var t2 = find(S.sheet.id), f = {};
    var nv = { status: segVal('e_status'), priority: segVal('e_prio'), owner: document.getElementById('e_owner').value.trim(), due: document.getElementById('e_due').value, fn: document.getElementById('e_fn').value, remarks: document.getElementById('e_rem').value.trim(), vendor: document.getElementById('e_vendor').value.trim() };
    Object.keys(nv).forEach(function (k) { if ((t2[k] || '') !== nv[k]) f[k] = nv[k]; });
    var sid = S.sheet.id; closeSheet();
    if (Object.keys(f).length) saveFields(sid, f, 'Saved ✓'); return;
  }
  if (act === 'saveadd') {
    var task = document.getElementById('a_task').value.trim(); if (!task) { toast('Please type the task', true); return; }
    var fields = { task: task, category: document.getElementById('a_cat').value.trim(), priority: segVal('a_prio') || 'P1', fn: document.getElementById('a_fn').value, owner: document.getElementById('a_owner').value.trim(), due: document.getElementById('a_due').value, remarks: document.getElementById('a_rem').value.trim() };
    closeSheet();
    var tmp = { id: 'tmp' + Date.now(), category: fields.category || 'Other', task: fields.task, status: 'Pending', priority: fields.priority, vendor: '', cost: '', remarks: fields.remarks, planAhead: '', owner: fields.owner, due: fields.due, fn: fields.fn, completedOn: '', updatedBy: S.me, updatedAt: today() + ' 00:00' };
    S.tasks.push(tmp); S.pending++; render(); toast('Task added ✓');
    api('POST', { action: 'add', fields: fields }).then(function () { S.pending--; load(true); }).catch(function (er) { S.pending--; S.tasks = S.tasks.filter(function (x) { return x !== tmp; }); render(); toast('Not added — ' + er.message, true); });
    return;
  }
});
document.addEventListener('input', function (e) { if (e.target.id === 'gq') { S.gq = e.target.value; render(); window.scrollTo(0, 0); } });
document.addEventListener('change', function (e) {
  if (e.target.id === 'fcat') { S.fCat = e.target.value; render(); }
  if (e.target.id === 'fown') { S.fOwner = e.target.value; render(); }
});
setInterval(function () { if (!document.hidden && S.loaded && !S.sheet && S.pin && S.me) load(true); }, 45000);
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.loaded && !S.sheet) load(true); });

(function () { if (!S.pin || !S.me) return; try { var c = JSON.parse(LS.get('pl_cache') || 'null'); if (c && c.t && c.t.length) { S.tasks = c.t; S.vendors = c.v || []; S.payments = c.p || []; S.loaded = true; S.lastSync = c.at || Date.now(); } } catch (e) {} })();
render();
if (S.pin && S.me) load(true);
</script>
</body>
</html>
